<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>江湖少年身份测试</title>
    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
    <style>
        *{
          margin: 0;
          padding: 0;
          box-sizing: border-box;
          font-family: system-ui, "SimSun", serif;
        }
        body{
          text-align: center;
          padding: 30px 20px;
          background:
            radial-gradient(circle at 20% 10%, rgba(130, 160, 150, 0.10), transparent 28%),
            radial-gradient(circle at 80% 20%, rgba(110, 140, 130, 0.07), transparent 24%),
            linear-gradient(170deg, #f4f7f4 0%, #eef3ef 50%, #e7ede7 100%);
          color: #2f403b;
          min-height: 100vh;
        }

        /* 水墨江湖动画区域 */
        .jianghu-stage {
          position: relative;
          width: 100%;
          max-width: 700px;
          height: 260px;
          margin: 0 auto 28px auto;
          overflow: hidden;
          border-radius: 12px;
          box-shadow: 0 8px 24px rgba(40, 60, 55, 0.18);
        }
        .jianghu-bg {
          position: absolute;
          inset: 0;
          z-index: 1;
          animation: bg-push 14s ease-in-out infinite alternate;
        }
        .jianghu-bg img {
          width: 100%;
          height: 100%;
          object-fit: cover;
          display: block;
        }
        @keyframes bg-push {
          0% { transform: scale(1) translateX(0); }
          100% { transform: scale(1.08) translateX(-1%); }
        }
        .fog {
          position: absolute;
          top: 0;
          bottom: 0;
          width: 200%;
          background: linear-gradient(to right, rgba(255,255,255,0) 0%, rgba(255,255,255,0.30) 50%, rgba(255,255,255,0) 100%);
          z-index: 2;
          pointer-events: none;
        }
        .fog-1 { left: -100%; animation: fog-move 12s linear infinite; }
        .fog-2 { left: -100%; animation: fog-move 18s linear infinite; animation-delay: -6s; opacity:0.4; }
        .fog-3 { left: -100%; animation: fog-move 22s linear infinite; animation-delay: -10s; opacity:0.2; }
        @keyframes fog-move {
          0% { transform: translateX(0); }
          100% { transform: translateX(50%); }
        }
        .leaf {
          position: absolute;
          top: -40px;
          width:14px; height:14px;
          background: radial-gradient(circle at 30% 30%, #88a59a, #475d54);
          border-radius: 80% 0 80% 0;
          opacity:0.7;
          z-index:3;
          pointer-events:none;
          animation: leaf-fall linear infinite;
        }
        .leaf-1 { left:10%; animation-duration:9s; }
        .leaf-2 { left:30%; animation-duration:11s; animation-delay:-3s; }
        .leaf-3 { left:55%; animation-duration:10s; animation-delay:-5s; }
        .leaf-4 { left:75%; animation-duration:12s; animation-delay:-7s; }
        @keyframes leaf-fall {
          0% { transform: translateY(-20px) translateX(0) rotate(0deg); opacity:0; }
          10% { opacity:0.8; }
          100% { transform: translateY(520px) translateX(80px) rotate(720deg); opacity:0; }
        }
        .slash {
          position:absolute;
          top:50%;
          width:70%; height:2px;
          background:linear-gradient(90deg,transparent,#6b857c,transparent);
          z-index:4;
          filter:blur(1px);
          opacity:0;
          pointer-events:none;
          animation: slash-fade 4s ease-in-out infinite;
        }
        .slash-left { left:-20%; transform:rotate(-12deg); }
        .slash-right { right:-20%; transform:rotate(15deg); animation-delay:-2s; }
        @keyframes slash-fade {
          0%,40%,100% { opacity:0; }
          50% { opacity:0.55; }
        }
        .jianghu-vignette {
          position:absolute;
          inset:0;
          z-index:5;
          background:radial-gradient(ellipse at center, rgba(0,0,0,0) 55%, rgba(40,60,55,0.18) 100%);
          pointer-events:none;
        }

        /* 首页 */
        h1{
          font-size: 42px;
          letter-spacing: 4px;
          margin-bottom:12px;
          font-weight: 500;
          color: #243531;
          text-shadow: 0 1px 6px rgba(90, 120, 110, 0.15);
        }
        .desc{
          font-size:18px;
          color:#5f746c;
          margin-bottom:40px;
        }
        .btn-group{
          display:flex;
          gap:16px;
          justify-content:center;
          flex-wrap:wrap;
          margin-bottom:30px;
        }
        button{
          padding:14px 32px;
          border:1px solid #a9bdb4;
          background:rgba(120,150,140,0.06);
          color:#2f403b;
          font-size:18px;
          border-radius:4px;
          cursor:pointer;
          transition:0.2s;
        }
        button:hover{
          background:rgba(120,150,140,0.14);
          border-color:#8aa89c;
        }

        /* 答题区域 */
        .q-wrap{
          max-width:620px;
          margin:0 auto;
          display:none;
        }
        .q-index{
          color:#6e857c;
          margin-bottom:8px;
        }
        .q-title{
          font-size:22px;
          margin-bottom:24px;
          line-height:1.6;
        }
        .opt-item{
          border:1px solid #b9cdc4;
          padding:14px 20px;
          border-radius:6px;
          margin-bottom:12px;
          cursor:pointer;
          transition:0.2s;
          text-align:left;
          background:rgba(120,150,140,0.04);
        }
        .opt-item:hover{
          border-color:#8aa89c;
          background:rgba(120,150,140,0.10);
        }
        .ctrl-row{
          display:flex;
          gap:12px;
          justify-content:center;
          margin-top:24px;
        }

        /* 结果页 */
        .res-wrap{
          max-width:640px;
          margin:0 auto;
          display:none;
          text-align:left;
          border:1px solid #b9cdc4;
          padding:24px;
          border-radius:12px;
          background: linear-gradient(160deg, #f7faf7, #eef4ef);
          box-shadow: 0 10px 30px rgba(40,60,55,0.12);
        }
        .res-wrap h2{
          text-align:center;
          margin-bottom:20px;
          font-size:24px;
          color:#243531;
        }
        /* 八维柱状图 */
        .bar-box{
          width:100%;
          padding:16px 0;
          margin-bottom:20px;
        }
        .bar-row{
          display:flex;
          justify-content:space-around;
          align-items:flex-end;
          height:160px;
          gap:4px;
        }
        .bar-col{
          flex:1;
          display:flex;
          flex-direction:column;
          align-items:center;
        }
        .bar-bg{
          width:28px;
          height:150px;
          background:#dce7e1;
          border-radius:2px;
          position:relative;
        }
        .bar-fill{
          width:100%;
          background:#5b756b;
          border-radius:2px;
          position:absolute;
          bottom:0;
          transition:height 0.4s ease;
        }
        .bar-label{
          margin-top:6px;
          font-size:13px;
          color:#455c54;
        }
        .bar-score{
          font-size:12px;
          color:#6e857c;
        }
        .tag-row{
          display:flex;
          gap:10px;
          justify-content:center;
          margin:20px 0;
        }
        .tag{
          padding:6px 14px;
          border:1px solid #a9bdb4;
          background:rgba(120,150,140,0.06);
          border-radius:3px;
          color:#2f403b;
        }
        .match-item{
          padding:12px 10px;
          margin:10px 0;
          border:1px solid #c9d9d1;
          background:rgba(120,150,140,0.03);
        }
        .match-title{
          color:#5f746c;
          font-size:14px;
          margin-bottom:4px;
        }
        .match-name{
          font-weight:bold;
          font-size:17px;
          color:#243531;
        }
        .res-bottom{
          display:flex;
          gap:12px;
          justify-content:center;
          margin-top:26px;
          flex-wrap:wrap;
        }

        /* 图鉴页 */
        .book-wrap{
          max-width:680px;
          margin:0 auto;
          display:none;
          text-align:left;
        }
        .book-wrap h2{
          text-align:center;
          font-size:34px;
          margin-bottom:30px;
          letter-spacing:4px;
          color:#243531;
        }
        .book-card{
          border:1px solid #b9cdc4;
          padding:18px 22px;
          border-radius:8px;
          margin-bottom:14px;
          background:rgba(120,150,140,0.04);
        }
        .book-card h3{
          font-size:20px;
          margin-bottom:6px;
          color:#243531;
        }
        .book-card p{
          color:#455c54;
          line-height:1.7;
          font-size:15px;
        }
        .book-back{
          text-align:center;
          margin-top:30px;
        }

        /* 打赏区域 */
        .donate-box{
          margin-top:24px;
          padding:18px 14px;
          border-top:1px solid #c9d9d1;
          text-align:center;
        }
        .donate-tip{
          color:#5f746c;
          font-size:14px;
          margin-bottom:12px;
        }
        .donate-qr{
          width:130px;
          height:130px;
          border-radius:6px;
          border:1px solid #b9cdc4;
        }
    </style>
</head>

<div class="jianghu-stage">

    // 性格匹配库
    const matchPool = [
      {dim:[0,4,3,2,3,4,2,1], partner:"追风少年·烈刃（热血×跳脱）", bosom:"云间客·随安（旷达温柔，同你看遍山河）"},
      {dim:[4,2,1,3,2,1,4,0], partner:"青衫剑客·知遥（疏狂×持重）", bosom:"执剑伴·星寻（热忱坚定，与你共赴风波）"},
      {dim:[2,3,2,4,1,4,2,0], partner:"灵机少侠·阿策（锐敏×赴义）", bosom:"静思客·砚秋（心思通透，懂你未尽之言）"},

    // 全局变量
    let current = 0;
    let answerList = [];
    let dimScore = [0,0,0,0,0,0,0,0];

    const home = document.getElementById("home");

    const rBox = document.getElementById("resultBox");
    const bBox = document.getElementById("bookBox");

    const qTitle = document.getElementById("qTitle");
    const optList = document.getElementById("optList");
    const prevBtn = document.getElementById("prevBtn");
    const barBox = document.getElementById("barBox");
    const tagRow = document.getElementById("tagRow");
    const partnerDom = document.getElementById("partner");
    const bosomDom = document.getElementById("bosom");
    const bookListDom = document.getElementById("bookList");

    // 页面切换
    function showPage(p){
      home.style.display="none";
      qBox.style.display="none";
      rBox.style.display="none";
      bBox.style.display="none";
      if(p==="home") home.style.display="block";
      if(p==="q") qBox.style.display="block";
      if(p==="res") rBox.style.display="block";
      if(p==="book") bBox.style.display="block";
    }

    // 重新计算全部维度分数
    function calcScore(){
      dimScore = [0,0,0,0,0,0,0,0];
      for(let s of answerList){
        if(s) dimScore = dimScore.map((v,i)=>v+s[i]);
      }
    }

    // 渲染当前题目
    function renderQ(){
      const q = questions[current];
      qIndex.innerText = `第 ${current+1} / ${questions.length} 题`;
      qTitle.innerText = q.title;
      optList.innerHTML = "";
      q.opt.forEach((o,idx)=>{
        const div = document.createElement("div");
        div.className = "opt-item";
        div.innerText = o.txt;
        div.onclick = ()=>{
          answerList[current] = o.s;
          calcScore();
          current++;
          if(current >= questions.length){
            showResult();
          }else{
            renderQ();
          }
        }
        optList.appendChild(div);
      })
      prevBtn.style.visibility = current>0 ? "visible":"hidden";
    }

    // 上一题按钮逻辑
    prevBtn.onclick = ()=>{
      if(current <= 0) return;
      current--;
      renderQ();
    }

    // 向量距离，用来匹配最合适搭档知己
    function getDist(a,b){
      let sum=0;
      for(let i=0;i<8;i++) sum += (a[i]-b[i])*(a[i]-b[i]);
      return sum;
    }

    // 结果页渲染
    function showResult(){
      showPage("res");
      // 归一到0~5
      const maxRaw = Math.max(...dimScore);
      const norm = dimScore.map(v=> maxRaw===0 ? 0 : Math.round(v/maxRaw * 5));

      // 绘制柱状图
      barBox.innerHTML = "";
      const row = document.createElement("div");
      row.className="bar-row";
      for(let i=0;i<8;i++){
        const col = document.createElement("div");
        col.className="bar-col";
        col.innerHTML = `
          <div class="bar-bg">
            <div class="bar-fill" style="height:${norm[i]/dimMax*100}%"></div>
          </div>
          <div class="bar-label">${dimNames[i]}</div>
          <div class="bar-score">${norm[i]}</div>
        `;
        row.appendChild(col);
      }
      barBox.appendChild(row);

      // 取TOP3标签
      const rank = [...norm].map((v,i)=>({v,i})).sort((a,b)=>b.v-a.v);
      tagRow.innerHTML = "";
      for(let i=0;i<3;i++){
        const t = document.createElement("span");
        t.className="tag";
        t.innerText = dimNames[rank[i].i];
        tagRow.appendChild(t);
      }

      // 匹配最合适
      let best = matchPool[0];
      let minD = getDist(norm, matchPool[0].dim);
      for(let m of matchPool){
        const d = getDist(norm, m.dim);
        if(d < minD){
          minD = d;
          best = m;
        }
      }
      partnerDom.innerText = best.partner;
      bosomDom.innerText = best.bosom;

      // 匹配江湖身份
      const totalRaw = dimScore.reduce((a,b)=>a+b,0);
      const idx = Math.min(Math.floor((totalRaw - 30)/3),29);
      const res = resultList[idx];
      document.querySelector(".res-wrap h2").innerText = `你的江湖身份：${res.name}`;
    }

    // 保存图片
    saveImgBtn.onclick = async ()=>{
      try{
        const canvas = await html2canvas(rBox, {scale:2,useCORS:true});

        link.download = "江湖测试结果.png";
        link.href = canvas.toDataURL("image/png");
        link.click();
      }catch(e){
        alert("保存失败，请换浏览器重试");
      }
    }

      const shareUrl = location.href;
      const shareTitle = "江湖少年身份测试";

          await navigator.share({

            text: shareText,
            url: shareUrl

            await navigator.clipboard.writeText(shareUrl);

            alert("复制失败，请手动复制地址栏链接");

          await navigator.clipboard.writeText(shareUrl);
          alert("链接已复制，发给好友！");

          alert("复制失败，请手动复制地址栏链接");
        }
      }
    }

      current=0;
      answerList=[];
      dimScore=[0,0,0,0,0,0,0,0];
      showPage("q");
      renderQ();
    }
    bookBtn.onclick = ()=>showPage("book");
    restartBtn.onclick = ()=>{
      current=0;
      answerList=[];
      dimScore=[0,0,0,0,0,0,0,0];
      showPage("home");
    }
    toBookBtn.onclick = ()=>showPage("book");
    backHomeBtn.onclick = ()=>showPage("home");
</script>
