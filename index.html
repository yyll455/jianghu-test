<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>江湖少年身份测试</title>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: system-ui, "SimSun", serif;
  }

  body {
    min-height: 100vh;
    text-align: center;
    padding: 24px 18px 40px;
    color: #2f403b;
    background:
      radial-gradient(circle at 20% 10%, rgba(140, 170, 160, 0.18), transparent 32%),
      radial-gradient(circle at 80% 20%, rgba(120, 150, 140, 0.14), transparent 28%),
      linear-gradient(180deg, #f4f7f4 0%, #eef3ef 45%, #e6ece6 100%);
  }

  /* 顶部动画区保持不动 */
  .jianghu-stage {
    position: relative;
    width: 100%;
    max-width: 700px;
    height: 260px;
    margin: 0 auto 28px;
    overflow: hidden;
    border-radius: 14px;
    box-shadow: 0 10px 28px rgba(40, 60, 55, 0.18);
  }

  .jianghu-bg {
    position: absolute;
    inset: 0;
    z-index: 1;
    animation: bg-push 14s ease-in-out infinite alternate;
  }

  .jianghu-bg img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  @keyframes bg-push {
    0% { transform: scale(1) translateX(0); }
    100% { transform: scale(1.08) translateX(-1%); }
  }

  .fog {
    position: absolute;
    top: 0;
    bottom: 0;
    width: 200%;
    background: linear-gradient(to right, rgba(255,255,255,0) 0%, rgba(255,255,255,0.30) 50%, rgba(255,255,255,0) 100%);
    z-index: 2;
    pointer-events: none;
  }

  .fog-1 { left: -100%; animation: fog-move 12s linear infinite; }
  .fog-2 { left: -100%; animation: fog-move 18s linear infinite; animation-delay: -6s; opacity: 0.4; }
  .fog-3 { left: -100%; animation: fog-move 22s linear infinite; animation-delay: -10s; opacity: 0.2; }

  @keyframes fog-move {
    0% { transform: translateX(0); }
    100% { transform: translateX(50%); }
  }

  .leaf {
    position: absolute;
    top: -40px;
    width: 14px;
    height: 14px;
    background: radial-gradient(circle at 30% 30%, #88a59a, #475d54);
    border-radius: 80% 0 80% 0;
    opacity: 0.7;
    z-index: 3;
    pointer-events: none;
    animation: leaf-fall linear infinite;
  }

  .leaf-1 { left: 10%; animation-duration: 9s; }
  .leaf-2 { left: 30%; animation-duration: 11s; animation-delay: -3s; }
  .leaf-3 { left: 55%; animation-duration: 10s; animation-delay: -5s; }
  .leaf-4 { left: 75%; animation-duration: 12s; animation-delay: -7s; }

  @keyframes leaf-fall {
    0% { transform: translateY(-20px) translateX(0) rotate(0deg); opacity: 0; }
    10% { opacity: 0.8; }
    100% { transform: translateY(520px) translateX(80px) rotate(720deg); opacity: 0; }
  }

  .slash {
    position: absolute;
    top: 50%;
    width: 70%;
    height: 2px;
    background: linear-gradient(90deg, transparent, #6b857c, transparent);
    z-index: 4;
    filter: blur(1px);
    opacity: 0;
    pointer-events: none;
    animation: slash-fade 4s ease-in-out infinite;
  }

  .slash-left { left: -20%; transform: rotate(-12deg); }
  .slash-right { right: -20%; transform: rotate(15deg); animation-delay: -2s; }

  @keyframes slash-fade {
    0%, 40%, 100% { opacity: 0; }
    50% { opacity: 0.55; }
  }

  .jianghu-vignette {
    position: absolute;
    inset: 0;
    z-index: 5;
    background: radial-gradient(ellipse at center, rgba(0,0,0,0) 55%, rgba(40,60,55,0.18) 100%);
    pointer-events: none;
  }

  /* 首页卡片 */
  .home-card {
    max-width: 620px;
    margin: 0 auto;
    padding: 36px 28px;
    background: rgba(255, 255, 255, 0.62);
    border: 1px solid #d7dfd7;
    border-radius: 18px;
    box-shadow: 0 18px 40px rgba(40, 60, 55, 0.08),
                inset 0 1px 0 rgba(255, 255, 255, 0.6);
  }

  .title-seal {
    display: inline-block;
    padding: 4px 14px;
    border: 1px solid #b9cdc4;
    border-radius: 999px;
    font-size: 13px;
    color: #5f746c;
    letter-spacing: 4px;
    margin-bottom: 18px;
    background: rgba(255, 255, 255, 0.5);
  }

  h1 {
    font-size: 30px;
    letter-spacing: 4px;
    line-height: 1.7;
    font-weight: 500;
    color: #243531;
    text-shadow: 0 1px 6px rgba(90, 120, 110, 0.12);
    margin-bottom: 32px;
  }

  .divider {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    margin-bottom: 28px;
  }

  .divider .line {
    width: 40px;
    height: 1px;
    background: linear-gradient(90deg, transparent, #a9bdb4, transparent);
  }

  .divider .dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #8aa89c;
    box-shadow: 0 0 0 3px rgba(138, 168, 156, 0.12);
  }

  .btn-group {
    display: flex;
    gap: 16px;
    justify-content: center;
    flex-wrap: wrap;
  }

  button {
    padding: 13px 34px;
    border: 1px solid #a9bdb4;
    background: rgba(255, 255, 255, 0.7);
    color: #2f403b;
    font-size: 17px;
    border-radius: 999px;
    cursor: pointer;
    transition: 0.25s ease;
    letter-spacing: 2px;
  }

  button:hover {
    background: #fbfcfa;
    border-color: #7f9b91;
    transform: translateY(-2px);
    box-shadow: 0 10px 20px rgba(40, 60, 55, 0.12);
  }

  /* 答题页卡片 */
  .q-wrap {
    max-width: 620px;
    margin: 0 auto;
    display: none;
  }

  .q-card {
    padding: 30px 24px;
    background: rgba(255, 255, 255, 0.62);
    border: 1px solid #d7dfd7;
    border-radius: 18px;
    box-shadow: 0 18px 40px rgba(40, 60, 55, 0.08),
                inset 0 1px 0 rgba(255, 255, 255, 0.6);
  }

  .q-index {
    display: inline-block;
    padding: 4px 12px;
    border: 1px solid #b9cdc4;
    border-radius: 999px;
    font-size: 13px;
    color: #546b63;
    letter-spacing: 3px;
    margin-bottom: 14px;
    background: rgba(255, 255, 255, 0.5);
  }

  .q-title {
    font-size: 21px;
    line-height: 1.7;
    color: #243531;
    margin-bottom: 24px;
    text-align: left;
  }

  .opt-item {
    border: 1px solid #cfddd5;
    padding: 15px 18px;
    border-radius: 14px;
    margin-bottom: 12px;
    cursor: pointer;
    transition: 0.25s ease;
    text-align: left;
    background: rgba(255, 255, 255, 0.55);
    color: #354a43;
    font-size: 15px;
    line-height: 1.6;
  }

  .opt-item:hover {
    border-color: #8aa89c;
    background: #fbfcfa;
    transform: translateY(-1px);
    box-shadow: 0 8px 18px rgba(40, 60, 55, 0.1);
  }

  .ctrl-row {
    display: flex;
    gap: 12px;
    justify-content: center;
    margin-top: 24px;
  }

  /* 结果页不动 */
  .res-wrap {
    max-width: 640px;
    margin: 0 auto;
    display: none;
    text-align: left;
    border: 1px solid #b9cdc4;
    padding: 28px;
    border-radius: 14px;
    background: linear-gradient(160deg, #f7faf7, #eef4ef);
    box-shadow: 0 10px 30px rgba(40,60,55,0.12);
  }

  .res-wrap h2 {
    text-align: center;
    margin-bottom: 20px;
    font-size: 24px;
    color: #243531;
  }

  .bar-box {
    width: 100%;
    padding: 16px 0;
    margin-bottom: 20px;
  }

  .bar-row {
    display: flex;
    justify-content: space-around;
    align-items: flex-end;
    height: 160px;
    gap: 4px;
  }

  .bar-col {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .bar-bg {
    width: 28px;
    height: 150px;
    background: #dce7e1;
    border-radius: 2px;
    position: relative;
  }

  .bar-fill {
    width: 100%;
    background: #5b756b;
    border-radius: 2px;
    position: absolute;
    bottom: 0;
    transition: height 0.4s ease;
  }

  .bar-label {
    margin-top: 6px;
    font-size: 13px;
    color: #455c54;
  }

  .bar-score {
    font-size: 12px;
    color: #6e857c;
  }

  .tag-row {
    display: flex;
    gap: 10px;
    justify-content: center;
    margin: 20px 0;
    flex-wrap: wrap;
  }

  .tag {
    padding: 6px 14px;
    border: 1px solid #a9bdb4;
    background: rgba(120,150,140,0.06);
    border-radius: 3px;
    color: #2f403b;
  }

  .match-item {
    padding: 14px 12px;
    margin: 12px 0;
    border: 1px solid #c9d9d1;
    background: rgba(120,150,140,0.03);
    border-radius: 8px;
  }

  .match-title {
    color: #5f746c;
    font-size: 14px;
    margin-bottom: 6px;
  }

  .match-name {
    font-weight: bold;
    font-size: 17px;
    color: #243531;
  }

  .res-signature {
    text-align: center;
    margin: 22px 0 12px;
    color: #5f746c;
    font-size: 15px;
    letter-spacing: 2px;
  }

  .res-bottom {
    display: flex;
    gap: 12px;
    justify-content: center;
    margin-top: 8px;
    flex-wrap: wrap;
  }

  /* 图鉴页不动 */
  .book-wrap {
    max-width: 680px;
    margin: 0 auto;
    display: none;
    text-align: left;
  }

  .book-wrap h2 {
    text-align: center;
    font-size: 34px;
    margin-bottom: 30px;
    letter-spacing: 4px;
    color: #243531;
  }

  .book-card {
    border: 1px solid #b9cdc4;
    padding: 18px 22px;
    border-radius: 8px;
    margin-bottom: 14px;
    background: rgba(120,150,140,0.04);
  }

  .book-card h3 {
    font-size: 20px;
    margin-bottom: 6px;
    color: #243531;
  }

  .book-card p {
    color: #455c54;
    line-height: 1.7;
    font-size: 15px;
  }

  .book-back {
    text-align: center;
    margin-top: 30px;
  }

  /* 打赏区不动 */
  .donate-box {
    margin-top: 28px;
    padding: 20px 14px;
    border-top: 1px solid #c9d9d1;
    text-align: center;
  }

  .donate-tip {
    color: #5f746c;
    font-size: 14px;
    margin-bottom: 12px;
    letter-spacing: 1px;
  }

  .donate-qr {
    width: 130px;
    height: 130px;
    border-radius: 6px;
    border: 1px solid #b9cdc4;
  }

  /* 手机适配 */
  @media (max-width: 520px) {
    h1 {
      font-size: 24px;
      letter-spacing: 3px;
    }

    .q-title {
      font-size: 20px;
    }

    .home-card,
    .q-card {
      padding: 28px 20px;
    }
  }

  /* ========== 动态水墨江湖背景 ========== */
  .dynamic-bg {
    position: fixed;
    inset: 0;
    z-index: -1;
    overflow: hidden;
    pointer-events: none;
    background:
      radial-gradient(circle at 20% 10%, rgba(140, 170, 160, 0.18), transparent 32%),
      radial-gradient(circle at 80% 20%, rgba(120, 150, 140, 0.14), transparent 28%),
      linear-gradient(180deg, #f4f7f4 0%, #eef3ef 45%, #e6ece6 100%);
  }

  .mountain {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    height: 40%;
    background: linear-gradient(180deg, rgba(255,255,255,0) 0%, rgba(255,255,255,0) 40%, rgba(200,215,208,0.35) 100%);
    filter: blur(0.5px);
    opacity: 0.55;
  }

  .mountain::before,
  .mountain::after {
    content: "";
    position: absolute;
    left: -10%;
    width: 120%;
    height: 70%;
    background-repeat: repeat-x;
    background-size: 400px 180px;
    opacity: 0.35;
  }

  .mountain::before {
    bottom: 10%;
    background-image:
      radial-gradient(ellipse 120px 60px at 10% 100%, #7f9b91 0%, transparent 60%),
      radial-gradient(ellipse 160px 80px at 30% 100%, #6b857c 0%, transparent 60%),
      radial-gradient(ellipse 140px 70px at 55% 100%, #85a59a 0%, transparent 60%),
      radial-gradient(ellipse 180px 90px at 75% 100%, #739288 0%, transparent 60%),
      radial-gradient(ellipse 130px 65px at 90% 100%, #88a59a 0%, transparent 60%);
    animation: mountain-move 40s linear infinite;
  }

  .mountain::after {
    bottom: 0;
    background-image:
      radial-gradient(ellipse 100px 50px at 15% 100%, #5f7c73 0%, transparent 60%),
      radial-gradient(ellipse 140px 70px at 40% 100%, #4f6b63 0%, transparent 60%),
      radial-gradient(ellipse 120px 60px at 65% 100%, #648279 0%, transparent 60%),
      radial-gradient(ellipse 150px 75px at 85% 100%, #5a776f 0%, transparent 60%);
    animation: mountain-move 60s linear infinite reverse;
  }

  @keyframes mountain-move {
    0% { transform: translateX(0); }
    100% { transform: translateX(-80px); }
  }

  .bg-fog {
    position: absolute;
    width: 60%;
    height: 180px;
    border-radius: 50%;
    filter: blur(20px);
    opacity: 0.35;
    animation: fog-flow linear infinite;
  }

  .bg-fog.fog-1 {
    top: 18%;
    left: -20%;
    background: rgba(255, 255, 255, 0.6);
    animation-duration: 28s;
  }

  .bg-fog.fog-2 {
    top: 35%;
    left: -30%;
    background: rgba(210, 225, 218, 0.5);
    animation-duration: 36s;
    animation-delay: -10s;
  }

  .bg-fog.fog-3 {
    top: 55%;
    left: -25%;
    background: rgba(255, 255, 255, 0.45);
    animation-duration: 42s;
    animation-delay: -20s;
  }

  @keyframes fog-flow {
    0% { transform: translateX(0); }
    100% { transform: translateX(180vw); }
  }

  .bg-leaf {
    position: absolute;
    top: -40px;
    width: 12px;
    height: 12px;
    background: radial-gradient(circle at 30% 30%, #9bb7ad, #4f6b63);
    border-radius: 80% 0 80% 0;
    opacity: 0.55;
    animation: bg-leaf-fall linear infinite;
  }

  .bg-leaf:nth-child(1) { left: 8%; animation-duration: 14s; }
  .bg-leaf:nth-child(2) { left: 25%; animation-duration: 17s; animation-delay: -4s; }
  .bg-leaf:nth-child(3) { left: 45%; animation-duration: 15s; animation-delay: -8s; }
  .bg-leaf:nth-child(4) { left: 62%; animation-duration: 19s; animation-delay: -2s; }
  .bg-leaf:nth-child(5) { left: 78%; animation-duration: 16s; animation-delay: -11s; }
  .bg-leaf:nth-child(6) { left: 90%; animation-duration: 20s; animation-delay: -6s; }

  @keyframes bg-leaf-fall {
    0% { transform: translateY(-20px) translateX(0) rotate(0deg); opacity: 0; }
    10% { opacity: 0.6; }
    100% { transform: translateY(110vh) translateX(60px) rotate(720deg); opacity: 0; }
  }

  .bg-light {
    position: absolute;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.9);
    box-shadow: 0 0 12px rgba(255, 255, 255, 0.8);
    opacity: 0;
    animation: light-float 8s ease-in-out infinite;
  }

  .bg-light:nth-child(1) { left: 20%; top: 30%; animation-delay: 0s; }
  .bg-light:nth-child(2) { left: 50%; top: 18%; animation-delay: -3s; }
  .bg-light:nth-child(3) { left: 72%; top: 42%; animation-delay: -5s; }
  .bg-light:nth-child(4) { left: 35%; top: 60%; animation-delay: -7s; }

  @keyframes light-float {
    0%, 100% { opacity: 0; transform: translateY(0); }
    50% { opacity: 0.7; transform: translateY(-20px); }
  }
</style>
</head>
<body>

<div class="dynamic-bg">
  <div class="bg-fog fog-1"></div>
  <div class="bg-fog fog-2"></div>
  <div class="bg-fog fog-3"></div>
  <div class="bg-light"></div>
  <div class="bg-light"></div>
  <div class="bg-light"></div>
  <div class="bg-light"></div>
  <div class="bg-leaf"></div>
  <div class="bg-leaf"></div>
  <div class="bg-leaf"></div>
  <div class="bg-leaf"></div>
  <div class="bg-leaf"></div>
  <div class="bg-leaf"></div>
  <div class="mountain"></div>
</div>

<div class="jianghu-stage">
  <div class="jianghu-bg">
    <img src="zhulin.jpg" alt="竹林">
  </div>
  <div class="fog fog-1"></div>
  <div class="fog fog-2"></div>
  <div class="fog fog-3"></div>
  <div class="leaf leaf-1"></div>
  <div class="leaf leaf-2"></div>
  <div class="leaf leaf-3"></div>
  <div class="leaf leaf-4"></div>
  <div class="slash slash-left"></div>
  <div class="slash slash-right"></div>
  <div class="jianghu-vignette"></div>
</div>

<div id="home">
  <div class="home-card">
    <div class="title-seal">江湖门派测试</div>
    <h1>寒江孤影，江湖故人，少侠归于何门？</h1>
    <div class="divider">
      <span class="line"></span>
      <span class="dot"></span>
      <span class="line"></span>
    </div>
    <div class="btn-group">
      <button id="startBtn">开始测试</button>
      <button id="bookBtn">江湖图鉴</button>
    </div>
  </div>
</div>

<div class="q-wrap" id="questionBox">
  <div class="q-card">
    <div class="q-index" id="qIndex"></div>
    <div class="q-title" id="qTitle"></div>
    <div id="optList"></div>
    <div class="ctrl-row">
      <button id="prevBtn">上一题</button>
    </div>
  </div>
</div>

<div class="res-wrap" id="resultBox">
  <h2>你的江湖身份：</h2>
  <div class="bar-box" id="barBox"></div>
  <div class="tag-row" id="tagRow"></div>
  <div class="match-item">
    <div class="match-title">同行游侠</div>
    <div class="match-name" id="partner"></div>
  </div>
  <div class="match-item">
    <div class="match-title">神交至友</div>
    <div class="match-name" id="bosom"></div>
  </div>
  <div class="res-signature">
    江湖路远，祝少侠一帆风顺！
  </div>
  <div class="res-bottom">
    <button id="restartBtn">再测一次</button>
    <button id="saveImgBtn">保存图片</button>
    <button id="shareBtn">分享给朋友</button>
    <button id="toBookBtn">江湖图鉴</button>
  </div>

  <div class="donate-box" data-html2canvas-ignore>
    <div class="donate-tip">感谢小友投喂，江湖一遇，幸甚之至</div>
    <img class="donate-qr" src="donate.jpg" alt="打赏">
  </div>
</div>

<div class="book-wrap" id="bookBox">
  <h2>江湖图鉴</h2>
  <div id="bookList"></div>
  <div class="book-back">
    <button id="backHomeBtn">返回首页</button>
  </div>
</div>

<script>
  const dimNames = ["疏狂","热忱","跳脱","锐敏","念旧","赴义","持重","旷达"];
  const dimMax = 5;

  const questions = [
    {title:"路遇陌生人被强敌追杀，你会？",opt:[{txt:"出手相助，不问缘由",s:[0,2,0,0,1,2,1,0]},{txt:"静观其变，看清局势再决定",s:[1,1,0,2,0,1,2,0]},{txt:"绕道避开，不多管闲事",s:[2,0,0,1,0,0,0,2]},{txt:"暗中布局，坐收渔利",s:[2,0,2,2,0,0,1,0]}]},
    {title:"你最向往的兵器是？",opt:[{txt:"长剑，潇洒快意",s:[2,1,1,1,1,2,1,1]},{txt:"短刃，灵动突袭",s:[2,0,2,2,0,1,1,0]},{txt:"折扇，文雅藏锋",s:[1,1,0,2,0,1,2,1]},{txt:"重刀，势大力沉",s:[2,0,2,1,0,1,2,0]}]},

    const rank = [...norm].map((v, i) => ({v, i})).sort((a, b) => b.v - a.v);
    tagRow.innerHTML = "";
    for (let i = 0; i < 3; i++) {
      const t = document.createElement("span");
      t.className = "tag";
      t.innerText = dimNames[rank[i].i];
      tagRow.appendChild(t);
    }

    let best = matchPool[0];
    let minD = getDist(norm, matchPool[0].dim);
    for (let m of matchPool) {
      const d = getDist(norm, m.dim);
      if (d < minD) {
        minD = d;
        best = m;
      }
    }

    partnerDom.innerText = best.partner;
    bosomDom.innerText = best.bosom;

    const totalRaw = dimScore.reduce((a, b) => a + b, 0);
    const idx = Math.min(Math.floor((totalRaw - 30) / 3), 29);
    const res = resultList[idx];
    document.querySelector(".res-wrap h2").innerText = `你的江湖身份：${res.name}`;
  }

  saveImgBtn.onclick = async () => {
    try {
      const canvas = await html2canvas(rBox, {scale: 2, useCORS: true});
      const link = document.createElement("a");
      link.download = "江湖测试结果.png";
      link.href = canvas.toDataURL("image/png");
      link.click();
    } catch (e) {
      alert("保存失败，请换浏览器重试");
    }
  };

  shareBtn.onclick = async () => {
    const shareUrl = location.href;
    const shareTitle = "江湖少年身份测试";
    const shareText = "来测测你是江湖里哪一位少年！";
    if (navigator.share) {
      try {
        await navigator.share({title: shareTitle, text: shareText, url: shareUrl});
      } catch (err) {
        try {
          await navigator.clipboard.writeText(shareUrl);
          alert("链接已复制，发给好友！");
        } catch (e) {
          alert("复制失败，请手动复制地址栏链接");
        }
      }
    } else {
      try {
        await navigator.clipboard.writeText(shareUrl);
        alert("链接已复制，发给好友！");
      } catch (e) {
        alert("复制失败，请手动复制地址栏链接");
      }
    }
  };

  startBtn.onclick = () => {
    current = 0;
    answerList = [];
    dimScore = [0,0,0,0,0,0,0,0];
    showPage("q");
    renderQ();
  };

  bookBtn.onclick = () => showPage("book");
  restartBtn.onclick = () => {
    current = 0;
    answerList = [];
    dimScore = [0,0,0,0,0,0,0,0];
    showPage("home");
  };
  toBookBtn.onclick = () => showPage("book");
  backHomeBtn.onclick = () => showPage("home");
</script>

</body>
</html>
