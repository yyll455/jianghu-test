<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>江湖少年身份测试</title>
    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
    <style>
        * {
          margin: 0;
          padding: 0;
          box-sizing: border-box;
          font-family: system-ui, "SimSun", serif;
        }

        body {
          min-height: 100vh;
          text-align: center;
          padding: 24px 18px 40px;
          color: #2f403b;
          background:
            radial-gradient(circle at 20% 10%, rgba(140, 170, 160, 0.18), transparent 32%),
            radial-gradient(circle at 80% 20%, rgba(120, 150, 140, 0.14), transparent 28%),
            linear-gradient(180deg, #f4f7f4 0%, #eef3ef 45%, #e6ece6 100%);
        }

        .jianghu-stage {
          position: relative;
          width: 100%;
          max-width: 700px;
          height: 260px;
          margin: 0 auto 28px;
          overflow: hidden;
          border-radius: 14px;
          box-shadow: 0 10px 28px rgba(40, 60, 55, 0.18);
        }

        .jianghu-bg {
          position: absolute;
          inset: 0;
          z-index: 1;
          animation: bg-push 14s ease-in-out infinite alternate;
        }

        .jianghu-bg img {
          width: 100%;
          height: 100%;
          object-fit: cover;
          display: block;
        }

        @keyframes bg-push {
          0% { transform: scale(1) translateX(0); }
          100% { transform: scale(1.08) translateX(-1%); }
        }

        .fog {
          position: absolute;
          top: 0;
          bottom: 0;
          width: 200%;
          background: linear-gradient(to right, rgba(255,255,255,0) 0%, rgba(255,255,255,0.30) 50%, rgba(255,255,255,0) 100%);
          z-index: 2;
          pointer-events: none;
        }

        .fog-1 { left: -100%; animation: fog-move 12s linear infinite; }
        .fog-2 { left: -100%; animation: fog-move 18s linear infinite; animation-delay: -6s; opacity: 0.4; }
        .fog-3 { left: -100%; animation: fog-move 22s linear infinite; animation-delay: -10s; opacity: 0.2; }

        @keyframes fog-move {
          0% { transform: translateX(0); }
          100% { transform: translateX(50%); }
        }

        .leaf {
          position: absolute;
          top: -40px;
          width: 14px;
          height: 14px;
          background: radial-gradient(circle at 30% 30%, #88a59a, #475d54);
          border-radius: 80% 0 80% 0;
          opacity: 0.7;
          z-index: 3;
          pointer-events: none;
          animation: leaf-fall linear infinite;
        }

        .leaf-1 { left: 10%; animation-duration: 9s; }
        .leaf-2 { left: 30%; animation-duration: 11s; animation-delay: -3s; }
        .leaf-3 { left: 55%; animation-duration: 10s; animation-delay: -5s; }
        .leaf-4 { left: 75%; animation-duration: 12s; animation-delay: -7s; }

        @keyframes leaf-fall {
          0% { transform: translateY(-20px) translateX(0) rotate(0deg); opacity: 0; }
          10% { opacity: 0.8; }
          100% { transform: translateY(520px) translateX(80px) rotate(720deg); opacity: 0; }
        }

        .slash {
          position: absolute;
          top: 50%;
          width: 70%;
          height: 2px;
          background: linear-gradient(90deg, transparent, #6b857c, transparent);
          z-index: 4;
          filter: blur(1px);
          opacity: 0;
          pointer-events: none;
          animation: slash-fade 4s ease-in-out infinite;
        }

        .slash-left { left: -20%; transform: rotate(-12deg); }
        .slash-right { right: -20%; transform: rotate(15deg); animation-delay: -2s; }

        @keyframes slash-fade {
          0%, 40%, 100% { opacity: 0; }
          50% { opacity: 0.55; }
        }

        .jianghu-vignette {
          position: absolute;
          inset: 0;
          z-index: 5;
          background: radial-gradient(ellipse at center, rgba(0,0,0,0) 55%, rgba(40,60,55,0.18) 100%);
          pointer-events: none;
        }

        .home-card {
          max-width: 620px;
          margin: 0 auto;
          padding: 36px 28px;
          background: rgba(255, 255, 255, 0.62);
          border: 1px solid #d7dfd7;
          border-radius: 18px;
          box-shadow: 0 18px 40px rgba(40, 60, 55, 0.08),
                      inset 0 1px 0 rgba(255, 255, 255, 0.6);
        }

        .title-seal {
          display: inline-block;
          padding: 4px 14px;
          border: 1px solid #b9cdc4;
          border-radius: 999px;
          font-size: 13px;
          color: #5f746c;
          letter-spacing: 4px;
          margin-bottom: 18px;
          background: rgba(255, 255, 255, 0.5);
        }

        h1 {
          font-size: 30px;
          letter-spacing: 4px;
          line-height: 1.7;
          font-weight: 500;
          color: #243531;
          text-shadow: 0 1px 6px rgba(90, 120, 110, 0.12);
          margin-bottom: 32px;
        }

        .divider {
          display: flex;
          align-items: center;
          justify-content: center;
          gap: 12px;
          margin-bottom: 28px;
        }

        .divider .line {
          width: 40px;
          height: 1px;
          background: linear-gradient(90deg, transparent, #a9bdb4, transparent);
        }

        .divider .dot {
          width: 6px;
          height: 6px;
          border-radius: 50%;
          background: #8aa89c;
          box-shadow: 0 0 0 3px rgba(138, 168, 156, 0.12);
        }

        .btn-group {
          display: flex;
          gap: 16px;
          justify-content: center;
          flex-wrap: wrap;
        }

        button {
          padding: 13px 34px;
          border: 1px solid #a9bdb4;
          background: rgba(255, 255, 255, 0.7);
          color: #2f403b;
          font-size: 17px;
          border-radius: 999px;
          cursor: pointer;
          transition: 0.25s ease;
          letter-spacing: 2px;
        }

        button:hover {
          background: #fbfcfa;
          border-color: #7f9b91;
          transform: translateY(-2px);
          box-shadow: 0 10px 20px rgba(40, 60, 55, 0.12);
        }

        .q-wrap {
          max-width: 620px;
          margin: 0 auto;
          display: none;
        }

        .q-card {
          padding: 30px 24px;
          background: rgba(255, 255, 255, 0.62);
          border: 1px solid #d7dfd7;
          border-radius: 18px;
          box-shadow: 0 18px 40px rgba(40, 60, 55, 0.08),
                      inset 0 1px 0 rgba(255, 255, 255, 0.6);
        }

        .q-index {
          display: inline-block;
          padding: 4px 12px;
          border: 1px solid #b9cdc4;
          border-radius: 999px;
          font-size: 13px;
          color: #546b63;
          letter-spacing: 3px;
          margin-bottom: 14px;
          background: rgba(255, 255, 255, 0.5);
        }

        .q-title {
          font-size: 21px;
          line-height: 1.7;
          color: #243531;
          margin-bottom: 24px;
          text-align: left;
        }

        .opt-item {
          border: 1px solid #cfddd5;
          padding: 15px 18px;
          border-radius: 14px;
          margin-bottom: 12px;
          cursor: pointer;
          transition: 0.25s ease;
          text-align: left;
          background: rgba(255, 255, 255, 0.55);
          color: #354a43;
          font-size: 15px;
          line-height: 1.6;
        }

        .opt-item:hover {
          border-color: #8aa89c;
          background: #fbfcfa;
          transform: translateY(-1px);
          box-shadow: 0 8px 18px rgba(40, 60, 55, 0.1);
        }

        .ctrl-row {
          display: flex;
          gap: 12px;
          justify-content: center;
          margin-top: 24px;
        }

        .res-wrap {
          max-width: 640px;
          margin: 0 auto;
          display: none;
          text-align: left;
          border: 1px solid #b9cdc4;
          padding: 28px;
          border-radius: 14px;
          background: linear-gradient(160deg, #f7faf7, #eef4ef);
          box-shadow: 0 10px 30px rgba(40,60,55,0.12);
        }

        .res-wrap h2 {
          text-align: center;
          margin-bottom: 20px;
          font-size: 24px;
          color: #243531;
        }

        .bar-box {
          width: 100%;
          padding: 16px 0;
          margin-bottom: 20px;
        }

        .bar-row {
          display: flex;
          justify-content: space-around;
          align-items: flex-end;
          height: 160px;
          gap: 4px;
        }

        .bar-col {
          flex: 1;
          display: flex;
          flex-direction: column;
          align-items: center;
        }

        .bar-bg {
          width: 28px;
          height: 150px;
          background: #dce7e1;
          border-radius: 2px;
          position: relative;
        }

        .bar-fill {
          width: 100%;
          background: #5b756b;
          border-radius: 2px;
          position: absolute;
          bottom: 0;
          transition: height 0.4s ease;
        }

        .bar-label {
          margin-top: 6px;
          font-size: 13px;
          color: #455c54;
        }

        .bar-score {
          font-size: 12px;
          color: #6e857c;
        }

        .tag-row {
          display: flex;
          gap: 10px;
          justify-content: center;
          margin: 20px 0;
          flex-wrap: wrap;
        }

        .tag {
          padding: 6px 14px;
          border: 1px solid #a9bdb4;
          background: rgba(120,150,140,0.06);
          border-radius: 3px;
          color: #2f403b;
        }

        .identity-desc{
          padding:16px 14px;
          margin:12px 0 18px;
          border:1px solid #c9d9d1;
          background:rgba(255,255,255,0.45);
          border-radius:10px;
          line-height:1.75;
          font-size:15px;
          color:#334842;
        }

        .res-signature {
          text-align: center;
          margin: 22px 0 12px;
          color: #5f746c;
          font-size: 15px;
          letter-spacing: 2px;
        }

        .res-bottom {
          display: flex;
          gap: 12px;
          justify-content: center;
          margin-top: 8px;
          flex-wrap: wrap;
        }

        .book-wrap {
          max-width: 680px;
          margin: 0 auto;
          display: none;
          text-align: left;
        }

        .book-wrap h2 {
          text-align: center;
          font-size: 34px;
          margin-bottom: 30px;
          letter-spacing: 4px;
          color: #243531;
        }

        .book-card {
          border: 1px solid #b9cdc4;
          padding: 18px 22px;
          border-radius: 8px;
          margin-bottom: 14px;
          background: rgba(120,150,140,0.04);
        }

        .book-card h3 {
          font-size: 20px;
          margin-bottom: 6px;
          color: #243531;
        }

        .book-card p {
          color: #455c54;
          line-height: 1.7;
          font-size: 15px;
        }

        .book-back {
          text-align: center;
          margin-top: 30px;
        }

        .donate-box {
          margin-top: 28px;
          padding: 20px 14px;
          border-top: 1px solid #c9d9d1;
          text-align: center;
        }

        .donate-tip {
          color: #5f746c;
          font-size: 14px;
          margin-bottom: 12px;
          letter-spacing: 1px;
        }

        .donate-qr {
          width: 130px;
          height: 130px;
          border-radius: 6px;
          border: 1px solid #b9cdc4;
        }

        @media (max-width: 520px) {
          h1 {
            font-size: 24px;
            letter-spacing: 3px;
          }
          .q-title {
            font-size: 20px;
          }
          .home-card,
          .q-card {
            padding: 28px 20px;
          }
        }

        .dynamic-bg {
          position: fixed;
          inset: 0;
          z-index: -1;
          overflow: hidden;
          pointer-events: none;
          background:
            radial-gradient(circle at 20% 10%, rgba(140, 170, 160, 0.18), transparent 32%),
            radial-gradient(circle at 80% 20%, rgba(120, 150, 140, 0.14), transparent 28%),
            linear-gradient(180deg, #f4f7f4 0%, #eef3ef 45%, #e6ece6 100%);
        }

        .mountain {
          position: absolute;
          left: 0;
          right: 0;
          bottom: 0;
          height: 40%;
          background: linear-gradient(180deg, rgba(255,255,255,0) 0%, rgba(255,255,255,0) 40%, rgba(200,215,208,0.35) 100%);
          filter: blur(0.5px);
          opacity: 0.55;
        }

        .mountain::before,
        .mountain::after {
          content: "";
          position: absolute;
          left: -10%;
          width: 120%;
          height: 70%;
          background-repeat: repeat-x;
          background-size: 400px 180px;
          opacity: 0.35;
        }

        .mountain::before {
          bottom: 10%;
          background-image:
            radial-gradient(ellipse 120px 60px at 10% 100%, #7f9b91 0%, transparent 60%),
            radial-gradient(ellipse 160px 80px at 30% 100%, #6b857c 0%, transparent 60%),
            radial-gradient(ellipse 140px 70px at 55% 100%, #85a59a 0%, transparent 60%),
            radial-gradient(ellipse 180px 90px at 75% 100%, #739288 0%, transparent 60%),
            radial-gradient(ellipse 130px 65px at 90% 100%, #88a59a 0%, transparent 60%);
          animation: mountain-move 40s linear infinite;
        }

        .mountain::after {
          bottom: 0;
          background-image:
            radial-gradient(ellipse 100px 50px at 15% 100%, #5f7c73 0%, transparent 60%),
            radial-gradient(ellipse 140px 70px at 40% 100%, #4f6b63 0%, transparent 60%),
            radial-gradient(ellipse 120px 60px at 65% 100%, #648279 0%, transparent 60%),
            radial-gradient(ellipse 150px 75px at 85% 100%, #5a776f 0%, transparent 60%);
          animation: mountain-move 60s linear infinite reverse;
        }

        @keyframes mountain-move {
          0% { transform: translateX(0); }
          100% { transform: translateX(-80px); }
        }

        .bg-fog {
          position: absolute;
          width: 60%;
          height: 180px;
          border-radius: 50%;
          filter: blur(20px);
          opacity: 0.35;
          animation: fog-flow linear infinite;
        }

        .bg-fog.fog-1 {
          top: 18%;
          left: -20%;
          background: rgba(255, 255, 255, 0.6);
          animation-duration: 28s;
        }

        .bg-fog.fog-2 {
          top: 35%;
          left: -30%;
          background: rgba(210, 225, 218, 0.5);
          animation-duration: 36s;
          animation-delay: -10s;
        }

        .bg-fog.fog-3 {
          top: 55%;
          left: -25%;
          background: rgba(255, 255, 255, 0.45);
          animation-duration: 42s;
          animation-delay: -20s;
        }

        @keyframes fog-flow {
          0% { transform: translateX(0); }
          100% { transform: translateX(180vw); }
        }

        .bg-leaf {
          position: absolute;
          top: -40px;
          width: 12px;
          height: 12px;
          background: radial-gradient(circle at 30% 30%, #9bb7ad, #4f6b63);
          border-radius: 80% 0 80% 0;
          opacity: 0.55;
          animation: bg-leaf-fall linear infinite;
        }

        .bg-leaf:nth-child(1) { left: 8%; animation-duration: 14s; }
        .bg-leaf:nth-child(2) { left: 25%; animation-duration: 17s; animation-delay: -4s; }
        .bg-leaf:nth-child(3) { left: 45%; animation-duration: 15s; animation-delay: -8s; }
        .bg-leaf:nth-child(4) { left: 62%; animation-duration: 19s; animation-delay: -2s; }
        .bg-leaf:nth-child(5) { left: 78%; animation-duration: 16s; animation-delay: -11s; }
        .bg-leaf:nth-child(6) { left: 90%; animation-duration: 20s; animation-delay: -6s; }

        @keyframes bg-leaf-fall {
          0% { transform: translateY(-20px) translateX(0) rotate(0deg); opacity: 0; }
          10% { opacity: 0.6; }
          100% { transform: translateY(110vh) translateX(60px) rotate(720deg); opacity: 0; }
        }

        .bg-light {
          position: absolute;
          width: 6px;
          height: 6px;
          border-radius: 50%;
          background: rgba(255, 255, 255, 0.9);
          box-shadow: 0 0 12px rgba(255, 255, 255, 0.8);
          opacity: 0;
          animation: light-float 8s ease-in-out infinite;
        }

        .bg-light:nth-child(1) { left: 20%; top: 30%; animation-delay: 0s; }
        .bg-light:nth-child(2) { left: 50%; top: 18%; animation-delay: -3s; }
        .bg-light:nth-child(3) { left: 72%; top: 42%; animation-delay: -5s; }
        .bg-light:nth-child(4) { left: 35%; top: 60%; animation-delay: -7s; }

        @keyframes light-float {
          0%, 100% { opacity: 0; transform: translateY(0); }
          50% { opacity: 0.7; transform: translateY(-20px); }
        }
    </style>
</head>
<body>

<div class="dynamic-bg">
    <div class="bg-fog fog-1"></div>
    <div class="bg-fog fog-2"></div>
    <div class="bg-fog fog-3"></div>
    <div class="bg-light"></div>
    <div class="bg-light"></div>
    <div class="bg-light"></div>
    <div class="bg-light"></div>
    <div class="bg-leaf"></div>
    <div class="bg-leaf"></div>
    <div class="bg-leaf"></div>
    <div class="bg-leaf"></div>
    <div class="bg-leaf"></div>
    <div class="bg-leaf"></div>
    <div class="mountain"></div>
</div>

<div class="jianghu-stage">
    <div class="jianghu-bg">
        <img src="zhulin.jpg" alt="竹林">
    </div>
    <div class="fog fog-1"></div>
    <div class="fog fog-2"></div>
    <div class="fog fog-3"></div>
    <div class="leaf leaf-1"></div>
    <div class="leaf leaf-2"></div>
    <div class="leaf leaf-3"></div>
    <div class="leaf leaf-4"></div>
    <div class="slash slash-left"></div>
    <div class="slash slash-right"></div>
    <div class="jianghu-vignette"></div>
</div>

<div id="home">
    <div class="home-card">
        <div class="title-seal">江湖门派测试</div>
        <h1>寒江孤影，江湖故人，少侠归于何门？</h1>
        <div class="divider">
            <span class="line"></span>
            <span class="dot"></span>
            <span class="line"></span>
        </div>
        <div class="btn-group">
            <button id="startBtn">开始测试</button>
            <button id="bookBtn">江湖图鉴</button>
        </div>
    </div>
</div>

<div class="q-wrap" id="questionBox">
    <div class="q-card">
        <div class="q-index" id="qIndex"></div>
        <div class="q-title" id="qTitle"></div>
        <div id="optList"></div>
        <div class="ctrl-row">
            <button id="prevBtn">上一题</button>
        </div>
    </div>
</div>

<div class="res-wrap" id="resultBox">
    <h2>你的江湖身份：</h2>
    <div class="bar-box" id="barBox"></div>
    <div class="tag-row" id="tagRow"></div>
    <div class="identity-desc" id="identityDesc"></div>

    <div class="res-signature">
        江湖路远，祝少侠一帆风顺！
    </div>
    <div class="res-bottom">
        <button id="restartBtn">再测一次</button>
        <button id="saveImgBtn">保存图片</button>
        <button id="shareBtn">分享给朋友</button>
        <button id="toBookBtn">江湖图鉴</button>
    </div>

    <div class="donate-box" data-html2canvas-ignore>
        <div class="donate-tip">感谢小友投喂，江湖一遇，幸甚之至</div>
        <img class="donate-qr" src="donate.jpg" alt="打赏">
    </div>
</div>

<div class="book-wrap" id="bookBox">
    <h2>江湖图鉴</h2>
    <div id="bookList"></div>
    <div class="book-back">
        <button id="backHomeBtn">返回首页</button>
    </div>
</div>

<script>
    const dimNames = ["侠气","赤诚","桀骜","敏锐","重诺","赴义","沉稳","洒脱"];
    const dimMax = 5;

    // 25 道新江湖气题目
    const questions = [
      {title:"1. 走在路上突然遇到有人在竹林里当众发癫（撕扯争执），你的第一反应是？",opt:[{txt:"A. 提剑上前：“吵什么吵！要打去演武场打，别挡着小爷赶路！”",s:[2,1,2,0,0,1,0,0]},{txt:"B. 默默按住刀柄，压低帽檐，冷冷地绕路走开。",s:[0,0,1,1,0,0,2,1]},{txt:"C. 搬个小板凳，掏出瓜子，暗中观察谁能打赢。",s:[0,0,0,2,0,0,0,2]},{txt:"D. “两位留步！不如花二十文钱，让贫道给二位算算今日谁有血光之灾？”",s:[0,0,1,2,0,0,1,1]}]},
      {title:"2. 你在绝密禁地发现了一本传闻能统治江湖的《盖世秘籍》，你会？",opt:[{txt:"A. 翻开第一页写着“欲练此功，先睡三天”，行，这功法你炼定了！",s:[0,1,0,0,0,0,0,2]},{txt:"B. 翻开看了两眼，全是复杂深奥的几何公式，当场放弃并给它贴个“仅供参考”。",s:[0,0,0,2,0,0,1,1]},{txt:"C. 卷起来塞怀里：“管他能不能统治江湖，拿去当铺至少能换三个月的烧鸡！”",s:[1,1,1,0,0,0,0,2]},{txt:"D. 严加封存并设下机关：“这种祸害人的东西，谁碰谁倒霉，都给爷远点。”",s:[1,0,0,1,2,2,2,0]}]},
      {title:"3. 面对上司（掌门/雇主）给安排的超高难度死任务，你的心态是？",opt:[{txt:"A. “冲！你的字典里就没有‘害怕’这两个字，干就完了！”",s:[2,2,1,0,1,2,0,0]},{txt:"B. “只要加钱加够，别说是龙潭虎穴，你当场表演胸口碎大石都行。”",s:[0,0,1,1,2,1,1,1]},{txt:"C. 表面恭敬接下，转头就找个借口溜下山去吃喝玩乐。",s:[0,0,1,0,0,0,0,2]},{txt:"D. 默默准备好三十种剧毒和机关，保证让对面体验到生活的残忍。",s:[0,0,2,2,0,0,2,0]}]},
      {title:"4. 江湖上突然流传出关于你的离谱谣言（比如脚踏三条船），你会？",opt:[{txt:"A. “清者自清，爱谁谁，有本事当面来打一架啊！”",s:[1,1,2,0,0,0,0,1]},{txt:"B. “造谣是吧？你反手就把对方的黑料印成传单贴满全城。”",s:[0,0,2,2,0,0,1,0]},{txt:"C. 表面稳如老狗，私下疯狂用小号在各大客栈论坛对线吃瓜。",s:[0,0,0,2,0,0,1,1]},{txt:"D. 微微一笑：“不错，这热度不蹭白不蹭，刚好用来抬高身价。”",s:[0,0,1,1,1,0,1,1]}]},
      {title:"5. 如果可以给这个乱糟糟的江湖提一个意见，你会说？",opt:[{txt:"A. “能不能少一点尔虞我诈，多一点大块吃肉的纯粹热血！”",s:[2,2,1,0,1,1,0,1]},{txt:"B. “建议所有人上岗前先考个证，别什么阿猫阿狗都能出来当大侠。”",s:[0,0,0,1,2,2,2,0]},{txt:"C. “关我屁事，只要不打扰你在竹林里喝茶睡觉，天塌下来当被子盖。”",s:[0,0,0,0,0,0,1,2]},{txt:"D. “把江湖交给你来管理，今天全场消费由你买单，统统听你的！”",s:[1,1,2,0,1,1,1,1]}]},
      {title:"6. 深夜在客栈喝酒，隔壁桌的大汉突然拍桌子大喊“莫挨老子”，你觉得他大概率是？",opt:[{txt:"A. 刚被门派开除的狂热中二少年，正在借酒发疯。",s:[0,1,1,0,0,0,0,1]},{txt:"B. 钱包被偷、今天连住店钱都没了的落魄江湖客。",s:[1,1,0,0,0,0,0,1]},{txt:"C. 表面凶神恶煞，其实只是菜点多了吃不完在懊恼。",s:[0,0,0,1,0,0,1,1]},{txt:"D. 喝了假酒的世外高手，等下就会倒在你的桌子底下。",s:[0,0,0,2,0,0,0,2]}]},
      {title:"7. 当你接下一单护送珍贵宝物的任务，结果发现雇主给的酬劳是一张画着大饼的空头支票，你会？",opt:[{txt:"A. 当场掀桌：“少来这套！今天不给现银，老子连你的宝物一起砸了！”",s:[1,1,2,0,0,0,0,0]},{txt:"B. 面无表情地收下空头支票，并把宝物悄悄转手卖给竞争对手。",s:[0,0,2,2,0,0,1,0]},{txt:"C. 叹口气认栽：“就当是扶贫了，谁让你长得好看呢。”",s:[1,2,0,0,1,1,0,1]},{txt:"D. 直接原地罢工，并微笑着把雇主的行踪出卖给各路仇家。",s:[0,0,2,1,0,0,1,1]}]},
      {title:"8. 在江湖集市上逛街，有人兜售号称能“打通任督二脉”的假大力丸，你会？",opt:[{txt:"A. 翻个白眼直接走开：“当小爷是智障吗？这智商税谁爱交谁交。”",s:[0,0,1,2,0,0,1,1]},{txt:"B. 顺手买两颗回去研究成分，顺便看看能不能山寨一个赚差价。",s:[0,0,0,2,0,0,2,0]},{txt:"C. “老板，给我来十斤！万一哪天真吃出超能力了呢？”",s:[0,2,1,0,0,0,0,2]},{txt:"D. 默默记住他的摊位，等天黑后套麻袋把他的假药全扬了。",s:[1,1,1,1,1,1,0,0]}]},
      {title:"9. 好不容易休假一天，结果被临时拉去帮同门师兄弟擦屁股（处理烂摊子），你的内心独白是？",opt:[{txt:"A. “毁灭吧，这个破江湖，一分钟都不想呆下去了！”",s:[0,0,1,0,0,0,0,2]},{txt:"B. “加钱！不加钱今天这事儿就是天王老子来了也休想解决。”",s:[0,0,1,0,2,1,1,0]},{txt:"C. 强行保持微笑：“没关系，我不生气的，真的（咬牙切齿）。”",s:[0,1,0,1,1,1,1,0]},{txt:"D. 表面答应，转头就订了去西域的单程驴车票直接跑路。",s:[0,0,1,1,0,0,0,2]}]},
      {title:"10. 如果要在江湖上给自己搞一个响亮的外号，你觉得以下哪个最符合你的精神状态？",opt:[{txt:"A. 绝命暴躁小陀螺（主打一个一言不合就开转）",s:[1,2,2,0,0,1,0,0]},{txt:"B. 资深脆皮吉祥物（身体虽废，嘴替无敌）",s:[0,1,0,1,0,0,0,2]},{txt:"C. 摸鱼带师兼隐形富豪（看着穷，其实偷偷存了好多碎银）",s:[0,0,0,2,1,0,2,1]},{txt:"D. 纯爱战神但手握剧毒（表面人畜无害，背後百草毒王）",s:[0,1,2,2,0,0,1,0]}]},
      {title:"11. 组队去夜探魔教总坛，结果走到半路队友集体装死跑路，你选择独自硬刚还是立刻反向逃跑？",opt:[{txt:"A. “靠！一群怂货，看小爷单枪匹马把这盘局给掀了！”",s:[2,2,2,0,0,2,0,0]},{txt:"B. 翻个白眼：“早猜到这帮家伙靠不住，溜了溜了，保命要紧。”",s:[0,0,1,1,0,0,1,2]},{txt:"C. 面不改色地把队友留下的干粮和地图全搜刮走，顺便还能反手卖个情报。",s:[0,0,1,2,1,0,1,1]},{txt:"D. “无量天尊，贫道掐指一算，今日不宜夜探，不如原地摆摊算卦。”",s:[0,0,0,2,0,0,1,2]}]},
      {title:"12. 辛辛苦苦攒了一大笔赏金，你是打算立刻买把绝世神兵，还是存起来当养老金？",opt:[{txt:"A. “买买买！今朝有酒今朝醉，神兵在手天下我有！”",s:[2,1,2,0,0,1,0,2]},{txt:"B. 分成三份：一份存钱庄吃利息，一份买房，剩下的买酒。",s:[0,0,0,1,2,1,2,0]},{txt:"C. 全拿去投资江湖上各种靠谱或不靠谱的小饭馆、当铺。",s:[0,0,1,2,1,0,1,1]},{txt:"D. 揣着巨款连夜隐居深山，过上朴实无华且枯燥的隐士生活。",s:[0,0,0,0,0,0,2,2]}]},
      {title:"13. 面对江湖上各种一见面就非要跟你“结拜”的自来熟，你的防御机制是什么？",opt:[{txt:"A. “少套近乎，先跟我的剑过两招再说！”",s:[1,0,2,0,0,0,0,0]},{txt:"B. 假笑敷衍：“好好好，异父异母的亲哥，改天一定请你喝酒（转头就忘）。”",s:[0,0,0,1,0,0,1,2]},{txt:"C. “结拜可以，先把今晚的酒钱结一下。”",s:[0,0,1,1,1,0,1,1]},{txt:"D. 默默退后三步，并在空气中撒了一把无色无味的防狼毒粉。",s:[0,0,2,2,0,0,1,0]}]},
      {title:"14. 被仇家一路围堵在华山绝路上时，你脑子里闪过的第一个念头居然是？",opt:[{txt:"A. “拼了！临死前也要拉两个垫背的，谁怂谁孙子！”",s:[2,2,2,0,0,2,0,0]},{txt:"B. “不是吧？我上个月刚买的新衣服还没穿热乎呢……”",s:[0,1,0,0,0,0,0,2]},{txt:"C. 观察地形：“从这个角度跳下去，生还的概率大概是百分之三点五。”",s:[0,0,0,2,0,0,2,0]},{txt:"D. “等等，那边好像有只野生叫花鸡，要不先吃一口再死？”",s:[1,1,0,0,0,0,0,2]}]},
      {title:"15. 面对一本厚重晦涩、满篇文言文的顶级内功心法，你的翻阅习惯是？",opt:[{txt:"A. 翻了两页直接合上：“什么天书？不如看隔壁说书人讲故事带劲。”",s:[0,1,1,0,0,0,0,2]},{txt:"B. 逐字逐句做满笔记，甚至还能挑出里面几个排版错别字。",s:[0,0,0,2,2,1,2,0]},{txt:"C. 只挑中间带有“速成”、“无敌”字样的段落看。",s:[1,1,1,0,0,0,0,1]},{txt:"D. 把秘籍拆开研究它的装订结构，顺便改良成暗器发射器。",s:[0,0,1,2,0,0,2,0]}]},
      {title:"16. 在门派里遇到倚老卖老、不讲道理的长老，你打算怎么重拳出击（或优雅阴阳）？",opt:[{txt:"A. 当场掀桌子硬刚：“老东西，别以为你头发白了小爷就不敢揍你！”",s:[1,2,2,0,0,1,0,0]},{txt:"B. 表面连连点头称是，转头就把长老的八卦写成话本贴满全城。",s:[0,0,1,2,0,0,1,1]},{txt:"C. 找个没人的地方疯狂扎草人诅咒，然后继续忍辱负重拿俸禄。",s:[0,0,0,1,1,1,1,1]},{txt:"D. “长老您身体这么硬朗，一定经得起晚辈一记排云掌吧？”",s:[1,1,2,0,0,1,0,0]}]},
      {title:"17. 当遇到让你有点心动的江湖侠客/侠女时，你的恋爱脑正在经历什么？",opt:[{txt:"A. 表面风平浪静，内心已经脑补完从成亲到孩子上学的八十万字大戏。",s:[0,2,0,1,1,1,1,1]},{txt:"B. 直接走上前：“少废话，今晚月色很好，跟我去城楼顶上喝一杯。”",s:[2,1,2,0,0,1,0,1]},{txt:"C. “谈恋爱影响拔剑的速度，还是搞钱比较快乐。”",s:[0,0,1,1,1,0,1,1]},{txt:"D. 偷偷送对方一包自己配置的“忘情水”（其实只是泻药）。",s:[0,0,2,2,0,0,1,0]}]},
      {title:"18. 连续一个月接不到悬赏任务、快要交不起客栈房租时，你的解压方式是？",opt:[{txt:"A. 气得在房间里疯狂俯卧撑，顺便把桌椅板凳修了又砸。",s:[1,2,2,0,0,1,0,0]},{txt:"B. 躺在床上双眼空洞地看着天花板：“毁灭吧，世界。”",s:[0,0,0,0,0,0,1,2]},{txt:"C. 连夜摆地摊帮别人代写情书或者代做暗器，绝不让自己饿死。",s:[0,1,0,2,2,1,1,0]},{txt:"D. 提着空酒壶去朋友那里蹭吃蹭喝，并理直气壮地白嫖。",s:[1,1,1,0,0,0,0,2]}]},
      {title:"19. 你的江湖穿搭核心理念究竟是什么？",opt:[{txt:"A. 怎么显眼怎么穿，全身上下写着“我是这条街最靓的仔”。",s:[2,1,2,0,0,0,0,1]},{txt:"B. 怎么舒服怎么来，常年一套洗得发白的粗布麻衣加草鞋。",s:[0,1,0,0,0,0,0,2]},{txt:"C. 表面低调朴素，内衬全是金丝软甲和藏宝图。",s:[0,0,0,2,1,1,2,0]},{txt:"D. 浑身挂满各种暗器、毒囊、机关和解毒丸，主打一个战术风。",s:[0,0,1,2,1,1,2,0]}]},
      {title:"20. 夜宿荒郊野岭时，你对自己的迷路概率有没有清醒的认知？",opt:[{txt:"A. “有地图和北斗星在，小爷怎么可能会迷路！（半个时辰后：这是哪？）”",s:[1,2,1,0,0,0,0,1]},{txt:"B. 闭眼随便选一条路：“反正条条大路通罗马，走到哪算哪。”",s:[0,0,0,0,0,0,0,2]},{txt:"C. 顺着蚂蚁搬家的方向走，说不定能找到水源或者隐世高人。",s:[0,1,0,2,0,0,1,1]},{txt:"D. 直接原地搭帐篷睡觉：“天黑了，不走了，爱谁谁。”",s:[0,0,0,0,0,0,2,2]}]},
      {title:"21. 华山论剑比武输给了一个名不见经传的菜鸟时，你的第一反应是？",opt:[{txt:"A. 当场急眼：“不可能！绝对有黑幕！我要跟你加赛三场！”",s:[1,2,2,0,0,1,0,0]},{txt:"B. 拍拍灰站起来：“行啊兄弟，明天这擂台的主位让给你坐。”",s:[2,1,0,0,1,1,0,2]},{txt:"C. 陷入深深的自我怀疑：“难道我这十年的功力全练到狗身上去了？”",s:[0,1,0,1,1,0,1,0]},{txt:"D. 微微一笑：“胜败乃兵家常事，主要是今天这风向影响了我的发挥。”",s:[0,0,1,1,0,0,1,2]}]},
      {title:"22. 如果让你在乱世江湖开一家店，你觉得什么店最容易发家致富？",opt:[{txt:"A. 兼营当铺、情报贩卖和黑市交易的神秘地下客栈。",s:[0,0,1,2,1,0,2,0]},{txt:"B. 卖各种解毒丸、跌打损伤药和速效救心丸的良心药铺。",s:[1,2,0,1,2,2,1,0]},{txt:"C. 专供各路大侠吃瓜吐槽、顺便提供代打服务的茶馆。",s:[0,1,1,2,0,0,0,2]},{txt:"D. 卖烤全羊和烈酒的西北大排档，主打一个烟火气。",s:[2,2,1,0,1,1,0,1]}]},
      {title:"23. 遇到别人在客栈大声外放土味小曲还唱得极其难听，你会选择加入还是物理闭麦？",opt:[{txt:"A. “唱的什么玩意儿！拔剑吧，让大家听听什么叫真正的仙乐！”",s:[1,1,2,0,0,0,0,0]},{txt:"B. 默默掏出塞耳朵的棉花，并在心里翻一万个白眼。",s:[0,0,0,1,0,0,1,2]},{txt:"C. 用内力传音弹一曲《高山流水》直接把对方的声音压过去。",s:[1,0,1,2,0,0,1,1]},{txt:"D. “兄弟，听我一句劝，再唱下去今晚的敌袭就不用等魔教了。”",s:[0,1,1,1,0,0,0,2]}]},
      {title:"24. 当你决定彻底摆烂、什么都不想干的时候，能坚持的最长时间是多少？",opt:[{txt:"A. 三分钟。体内沸腾的热血不允许你闲下来超过五分钟。",s:[2,2,2,0,0,1,0,0]},{txt:"B. 直到肚子饿得咕咕叫，或者房东开始疯狂敲门催租。",s:[0,1,0,0,0,0,0,2]},{txt:"C. 只要有茶喝有话本看，能在竹椅上躺到地老天荒。",s:[0,0,0,0,0,0,1,2]},{txt:"D. 摆烂的同时还在暗中观察谁比你更卷，随时准备反超。",s:[0,0,1,2,1,1,2,0]}]},
      {title:"25. 如果明天整个江湖就要因浩劫而重启，你最想带走的唯一一件东西是什么？",opt:[{txt:"A. 陪伴你多年的那柄老长剑（或者最顺手的家伙什）。",s:[2,1,1,0,1,1,0,1]},{txt:"B. 藏着你全部身家和秘密的小布袋。",s:[0,0,1,1,1,0,2,0]},{txt:"C. 记录了整个江湖各种黑历史和八卦的绝密账本。",s:[0,0,1,2,0,0,1,1]},{txt:"D. 一壶永远也喝不完的好酒。",s:[1,1,0,0,0,0,0,2]}]}

      {name:"古道游侠",desc:"漂泊四方，无门无派",newDesc:"马蹄踏碎夕阳，其实是因为你没钱住客栈。你生来便是为了四海为家，不问归处在何方，江湖便是天地间最大的流浪汉收容所。竹杖芒鞋轻胜马，主打一个全靠硬撑。",vec:[7,6,6,4,5,5,3,10]},
      {name:"神捕铁衣",desc:"明察秋毫，长刀斩邪",newDesc:"明察秋毫，长刀斩邪. 你手里的腰牌虽然冰冷，但扣押犯人的手特别热乎。劝这江湖上的显眼包们少在你面前发癫，你的刀不斩无名之辈，但专门治各种不服和老赖。",vec:[6,5,2,9,9,9,8,2]},
      {name:"破阵拳师",desc:"铁拳开山，热血豪情",newDesc:"拳开山河裂，气吞万里如虎。别跟你在那讲什么阴谋诡计，你这双砂锅大的铁拳就是唯一的真理。风雨越猛烈，你的火气就越大，今天不把对手捶服，你就是对方孙子！",vec:[7,9,9,3,6,8,2,4]},
      {name:"伏魔棍僧",desc:"古刹青灯，金刚手段",newDesc:"晨钟暮鼓敲不醒别人的脑干，但你的七尺长棍可以。你怀着极其慈悲的心肠，把恶人超度到生活不能自理。放下执念立地成佛，如果对方不肯放，那你就物理帮对方放。",vec:[6,8,5,5,7,9,7,4]},
      {name:"清风羽士",desc:"大笑红尘，超然自在",newDesc:"手执拂尘，大笑出入红尘中，主要是不想交门派社保。世人争破头的绝世秘籍在你眼里都是浮云，主要是因为你也抢不到。不如在竹林躺平，假装自己是个世外高人。",vec:[4,4,4,6,3,3,7,9]},
      {name:"奇门匠师",desc:"巧思御敌，掌控乾坤",newDesc:"铁锤叮当，火星四溅，冰冷的机关里藏着你无处安放的中二魂。世人皆迷信绝世武功，却不知你手中巧夺天工的秘器，能够一秒钟让敌人跪下叫爸爸，主打科技降维打击。",vec:[4,3,6,9,5,4,8,5]},
      {name:"情报暗探",desc:"游走暗处，洞悉秘闻",newDesc:"烛影摇曳的暗室里，你听到了这个江湖最不可告人的惊天大瓜。你永远活在阴影里，像个没有感情的八卦雷达。手里握着各门派掌门的黑料，随时准备发传单爆光。",vec:[3,2,5,10,4,3,7,6]},
      {name:"天机神相",desc:"铁口直断，看破沉浮",newDesc:"竹签一摇，神仙也得交二十文卦金。你能算准天下大势的阴晴圆缺，唯独算不出今天晚上吃什么。命运这东西玄之又玄，听你一句劝，遇事不决直接睡觉，摆烂最安稳。",vec:[4,3,5,9,4,3,8,8]},
      {name:"听风琴师",desc:"琴音疗愈，亦可杀人",newDesc:"一曲肝肠断，主要是因为你昨天没睡好。江南的细雨抚不平你抑郁的心，杀意起时直接七弦崩断送对手上路。别看你表面端庄优雅，其实心里已经把这破江湖骂了一万遍。",vec:[5,4,6,8,5,5,6,6]},
      {name:"杏林医仙",desc:"悬壶济世，仁心救人",newDesc:"这世上多的是求而不得的苦命人，主要是脑子都不太好使。你救得了别人的性命，却医不了别人无可救药的恋爱脑。药草无情，再不听话吃药，信不信你直接用银针扎哭对方？",vec:[6,8,3,7,8,8,7,5]},
      {name:"百草毒王",desc:"与毒为伴，善恶随心",newDesc:"他们都说你是杀人不眨眼的魔头，笑死，明明是人心比你的毒药更狠毒。你只想和你的百草毒虫安安静静过日子，人不犯我你自清高，人若犯我，让你直接体验极乐拉肚子。",vec:[3,2,9,8,3,3,5,7]},
      {name:"清风乞侠",desc:"破衣烂衫，肝胆相照",newDesc:"破衣烂衫怎么了？你的尊严全靠一身正气硬撑！竹杖芒鞋走天下，走到哪乞讨到哪。你不稀罕高门大户的虚礼，只要给碗热饭，对方就是你异父异母的亲哥，你带头冲锋！",vec:[8,9,7,3,7,8,2,8]}
    ];

    let current = 0;
    let answerList = [];
    let dimScore = [0,0,0,0,0,0,0,0];

    const home = document.getElementById("home");
    const qBox = document.getElementById("questionBox");
    const rBox = document.getElementById("resultBox");
    const bBox = document.getElementById("bookBox");
    const qIndex = document.getElementById("qIndex");
    const qTitle = document.getElementById("qTitle");
    const optList = document.getElementById("optList");
    const prevBtn = document.getElementById("prevBtn");
    const barBox = document.getElementById("barBox");
    const tagRow = document.getElementById("tagRow");
    const identityDescDom = document.getElementById("identityDesc");
    const bookListDom = document.getElementById("bookList");
    const saveImgBtn = document.getElementById("saveImgBtn");
    const shareBtn = document.getElementById("shareBtn");
    const restartBtn = document.getElementById("restartBtn");
    const toBookBtn = document.getElementById("toBookBtn");
    const backHomeBtn = document.getElementById("backHomeBtn");

    // 初始化图鉴卡片，同步展示专属文案
    bookListDom.innerHTML = "";
    resultList.forEach(item=>{
      const card = document.createElement("div");
      card.className = "book-card";
      card.innerHTML = `<h3>${item.name}</h3><p>${item.newDesc}</p>`;
      bookListDom.appendChild(card);
    })

    function showPage(p){
      home.style.display="none";
      qBox.style.display="none";
      rBox.style.display="none";
      bBox.style.display="none";
      if(p==="home") home.style.display="block";
      if(p==="q") qBox.style.display="block";
      if(p==="res") rBox.style.display="block";
      if(p==="book") bBox.style.display="block";
    }

    function calcScore(){
      dimScore = [0,0,0,0,0,0,0,0];
      for(let s of answerList){
        if(s) dimScore = dimScore.map((v,i)=>v+s[i]);
      }
    }

    function renderQ(){
      const q = questions[current];
      qIndex.innerText = `第 ${current+1} / ${questions.length} 题`;
      qTitle.innerText = q.title;
      optList.innerHTML = "";
      q.opt.forEach((o,idx)=>{
        const div = document.createElement("div");
        div.className = "opt-item";
        div.innerText = o.txt;
        div.onclick = ()=>{
          answerList[current] = o.s;
          calcScore();
          current++;
          if(current >= questions.length){
            showResult();
          }else{
            renderQ();
          }
        }
        optList.appendChild(div);
      })
      prevBtn.style.visibility = current>0 ? "visible":"hidden";
    }

    prevBtn.onclick = ()=>{
      if(current <= 0) return;
      current--;
      renderQ();
    }

    // 余弦相似度算法
    function cosSimilarity(a,b){
      let dot=0,normA=0,normB=0;
      for(let i=0;i<8;i++){
        dot += a[i]*b[i];
        normA += a[i]*a[i];
        normB += b[i]*b[i];
      }
      if(normA===0||normB===0) return 0;
      return dot/(Math.sqrt(normA)*Math.sqrt(normB));
    }

    // 初始化全角色平权补偿权重
    if(!window._charWeights) {
      window._charWeights = new Array(resultList.length).fill(1.0);
    }

    function showResult(){
      showPage("res");
      const maxRaw = Math.max(...dimScore);
      const norm = dimScore.map(v=> maxRaw===0 ? 0 : Math.round(v/maxRaw * 5));

      barBox.innerHTML = "";
      const row = document.createElement("div");
      row.className="bar-row";
      for(let i=0;i<8;i++){
        const col = document.createElement("div");
        col.className="bar-col";
        col.innerHTML = `
          <div class="bar-bg">
            <div class="bar-fill" style="height:${norm[i]/dimMax*100}%"></div>
          </div>
          <div class="bar-label">${dimNames[i]}</div>
          <div class="bar-score">${norm[i]}</div>
        `;
        row.appendChild(col);
      }
      barBox.appendChild(row);

      const rank = [...norm].map((v,i)=>({v,i})).sort((a,b)=>b.v-a.v);
      tagRow.innerHTML = "";
      for(let i=0;i<3;i++){
        const t = document.createElement("span");
        t.className="tag";
        t.innerText = dimNames[rank[i].i];
        tagRow.appendChild(t);
      }

      // 计算契合度，综合相似度与动态平权权重
      let simArr = [];
      for(let j=0;j<resultList.length;j++){
        const sim = cosSimilarity(norm, resultList[j].vec);
        const finalScore = (sim + 0.1) * window._charWeights[j];
        simArr.push({idx:j, score:finalScore});
      }

      // 取契合度最高的 Top 5 候选人加权抽取（动态平权算法）
      simArr.sort((x,y)=>y.score - x.score);
      const topCandidates = simArr.slice(0, 5);

      let totalWeight = 0;
      for(let item of topCandidates) totalWeight += item.score;
      let rnd = Math.random() * totalWeight;
      let pickIdx = topCandidates[0].idx;
      for(let item of topCandidates){
        rnd -= item.score;
        if(rnd <= 0){
          pickIdx = item.idx;
          break;
        }
      }

      // 更新各角色的平权权重（热门降权，冷门增权）
      for(let j=0; j<resultList.length; j++){
        if(j === pickIdx){
          window._charWeights[j] = Math.max(0.5, window._charWeights[j] * 0.85);
        } else {
          window._charWeights[j] = Math.min(3.0, window._charWeights[j] + 0.05);
        }
      }

      const res = resultList[pickIdx];
      document.querySelector(".res-wrap h2").innerText = `你的江湖身份：${res.name}`;
      identityDescDom.innerText = res.newDesc;
    }

    saveImgBtn.onclick = async ()=>{
      try{
        const canvas = await html2canvas(rBox, {scale:2,useCORS:true});
        const link = document.createElement("a");
        link.download = "江湖测试结果.png";
        link.href = canvas.toDataURL("image/png");
        link.click();
      }catch(e){
        alert("保存失败");
      }
    }

    shareBtn.onclick = async ()=>{
    if (navigator.share) {
      try {
        await navigator.share({
          title: '江湖少年身份测试',
          text: '快来看看你在江湖中是何身份！',
          url: window.location.href,
        });
      } catch (e) {
        // 用户取消分享时忽略
      }
    } else {
      const url = window.location.href;
      const input = document.createElement("input");
      input.value = url;
      document.body.appendChild(input);
      input.select();
      document.execCommand("copy");
      document.body.removeChild(input);
      alert("测试链接已复制成功！快去粘贴分享给好友吧~");
    }
  }


    restartBtn.onclick = ()=>{
      current=0;
      answerList=[];
      dimScore=[0,0,0,0,0,0,0,0];
      showPage("home");
    }

    bookBtn.onclick = ()=>showPage("book");
    toBookBtn.onclick = ()=>showPage("book");
    backHomeBtn.onclick = ()=>{
      current=0;
      answerList=[];
      dimScore=[0,0,0,0,0,0,0,0];
      showPage("home");
    }

    startBtn.onclick = ()=>{
      current=0;
      answerList=[];
      dimScore=[0,0,0,0,0,0,0,0];
      showPage("q");
      renderQ();
    }
</script>
