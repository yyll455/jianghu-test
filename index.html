<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>江湖少年身份测试</title>
    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
    <style>
        * {
          margin: 0;
          padding: 0;
          box-sizing: border-box;
          font-family: system-ui, "SimSun", serif;
        }

        body {
          min-height: 100vh;
          text-align: center;
          padding: 24px 18px 40px;
          color: #2f403b;
          background:
            radial-gradient(circle at 20% 10%, rgba(140, 170, 160, 0.18), transparent 32%),
            radial-gradient(circle at 80% 20%, rgba(120, 150, 140, 0.14), transparent 28%),
            linear-gradient(180deg, #f4f7f4 0%, #eef3ef 45%, #e6ece6 100%);
        }

        .jianghu-stage {
          position: relative;
          width: 100%;
          max-width: 700px;
          height: 260px;
          margin: 0 auto 28px;
          overflow: hidden;
          border-radius: 14px;
          box-shadow: 0 10px 28px rgba(40, 60, 55, 0.18);
        }

        .jianghu-bg {
          position: absolute;
          inset: 0;
          z-index: 1;
          animation: bg-push 14s ease-in-out infinite alternate;
        }

        .jianghu-bg img {
          width: 100%;
          height: 100%;
          object-fit: cover;
          display: block;
        }

        @keyframes bg-push {
          0% { transform: scale(1) translateX(0); }
          100% { transform: scale(1.08) translateX(-1%); }
        }

        .fog {
          position: absolute;
          top: 0;
          bottom: 0;
          width: 200%;
          background: linear-gradient(to right, rgba(255,255,255,0) 0%, rgba(255,255,255,0.30) 50%, rgba(255,255,255,0) 100%);
          z-index: 2;
          pointer-events: none;
        }

        .fog-1 { left: -100%; animation: fog-move 12s linear infinite; }
        .fog-2 { left: -100%; animation: fog-move 18s linear infinite; animation-delay: -6s; opacity: 0.4; }
        .fog-3 { left: -100%; animation: fog-move 22s linear infinite; animation-delay: -10s; opacity: 0.2; }

        @keyframes fog-move {
          0% { transform: translateX(0); }
          100% { transform: translateX(50%); }
        }

        .leaf {
          position: absolute;
          top: -40px;
          width: 14px;
          height: 14px;
          background: radial-gradient(circle at 30% 30%, #88a59a, #475d54);
          border-radius: 80% 0 80% 0;
          opacity: 0.7;
          z-index: 3;
          pointer-events: none;
          animation: leaf-fall linear infinite;
        }

        .leaf-1 { left: 10%; animation-duration: 9s; }
        .leaf-2 { left: 30%; animation-duration: 11s; animation-delay: -3s; }
        .leaf-3 { left: 55%; animation-duration: 10s; animation-delay: -5s; }
        .leaf-4 { left: 75%; animation-duration: 12s; animation-delay: -7s; }

        @keyframes leaf-fall {
          0% { transform: translateY(-20px) translateX(0) rotate(0deg); opacity: 0; }
          10% { opacity: 0.8; }
          100% { transform: translateY(520px) translateX(80px) rotate(720deg); opacity: 0; }
        }

        .slash {
          position: absolute;
          top: 50%;
          width: 70%;
          height: 2px;
          background: linear-gradient(90deg, transparent, #6b857c, transparent);
          z-index: 4;
          filter: blur(1px);
          opacity: 0;
          pointer-events: none;
          animation: slash-fade 4s ease-in-out infinite;
        }

        .slash-left { left: -20%; transform: rotate(-12deg); }
        .slash-right { right: -20%; transform: rotate(15deg); animation-delay: -2s; }

        @keyframes slash-fade {
          0%, 40%, 100% { opacity: 0; }
          50% { opacity: 0.55; }
        }

        .jianghu-vignette {
          position: absolute;
          inset: 0;
          z-index: 5;
          background: radial-gradient(ellipse at center, rgba(0,0,0,0) 55%, rgba(40,60,55,0.18) 100%);
          pointer-events: none;
        }

        .home-card {
          max-width: 620px;
          margin: 0 auto;
          padding: 36px 28px;
          background: rgba(255, 255, 255, 0.62);
          border: 1px solid #d7dfd7;
          border-radius: 18px;
          box-shadow: 0 18px 40px rgba(40, 60, 55, 0.08),
                      inset 0 1px 0 rgba(255, 255, 255, 0.6);
        }

        .title-seal {
          display: inline-block;
          padding: 4px 14px;
          border: 1px solid #b9cdc4;
          border-radius: 999px;
          font-size: 13px;
          color: #5f746c;
          letter-spacing: 4px;
          margin-bottom: 18px;
          background: rgba(255, 255, 255, 0.5);
        }

        h1 {
          font-size: 30px;
          letter-spacing: 4px;
          line-height: 1.7;
          font-weight: 500;
          color: #243531;
          text-shadow: 0 1px 6px rgba(90, 120, 110, 0.12);
          margin-bottom: 32px;
        }

        .divider {
          display: flex;
          align-items: center;
          justify-content: center;
          gap: 12px;
          margin-bottom: 28px;
        }

        .divider .line {
          width: 40px;
          height: 1px;
          background: linear-gradient(90deg, transparent, #a9bdb4, transparent);
        }

        .divider .dot {
          width: 6px;
          height: 6px;
          border-radius: 50%;
          background: #8aa89c;
          box-shadow: 0 0 0 3px rgba(138, 168, 156, 0.12);
        }

        .btn-group {
          display: flex;
          gap: 16px;
          justify-content: center;
          flex-wrap: wrap;
        }

        button {
          padding: 13px 34px;
          border: 1px solid #a9bdb4;
          background: rgba(255, 255, 255, 0.7);
          color: #2f403b;
          font-size: 17px;
          border-radius: 999px;
          cursor: pointer;
          transition: 0.25s ease;
          letter-spacing: 2px;
        }

        button:hover {
          background: #fbfcfa;
          border-color: #7f9b91;
          transform: translateY(-2px);
          box-shadow: 0 10px 20px rgba(40, 60, 55, 0.12);
        }

        .q-wrap {
          max-width: 620px;
          margin: 0 auto;
          display: none;
        }

        .q-card {
          padding: 30px 24px;
          background: rgba(255, 255, 255, 0.62);
          border: 1px solid #d7dfd7;
          border-radius: 18px;
          box-shadow: 0 18px 40px rgba(40, 60, 55, 0.08),
                      inset 0 1px 0 rgba(255, 255, 255, 0.6);
        }

        .q-index {
          display: inline-block;
          padding: 4px 12px;
          border: 1px solid #b9cdc4;
          border-radius: 999px;
          font-size: 13px;
          color: #546b63;
          letter-spacing: 3px;
          margin-bottom: 14px;
          background: rgba(255, 255, 255, 0.5);
        }

        .q-title {
          font-size: 21px;
          line-height: 1.7;
          color: #243531;
          margin-bottom: 24px;
          text-align: left;
        }

        .opt-item {
          border: 1px solid #cfddd5;
          padding: 15px 18px;
          border-radius: 14px;
          margin-bottom: 12px;
          cursor: pointer;
          transition: 0.25s ease;
          text-align: left;
          background: rgba(255, 255, 255, 0.55);
          color: #354a43;
          font-size: 15px;
          line-height: 1.6;
        }

        .opt-item:hover {
          border-color: #8aa89c;
          background: #fbfcfa;
          transform: translateY(-1px);
          box-shadow: 0 8px 18px rgba(40, 60, 55, 0.1);
        }

        .ctrl-row {
          display: flex;
          gap: 12px;
          justify-content: center;
          margin-top: 24px;
        }

        .res-wrap {
          max-width: 640px;
          margin: 0 auto;
          display: none;
          text-align: left;
          border: 1px solid #b9cdc4;
          padding: 28px;
          border-radius: 14px;
          background: linear-gradient(160deg, #f7faf7, #eef4ef);
          box-shadow: 0 10px 30px rgba(40,60,55,0.12);
        }

        .res-wrap h2 {
          text-align: center;
          margin-bottom: 20px;
          font-size: 24px;
          color: #243531;
        }

        .bar-box {
          width: 100%;
          padding: 16px 0;
          margin-bottom: 20px;
        }

        .bar-row {
          display: flex;
          justify-content: space-around;
          align-items: flex-end;
          height: 160px;
          gap: 4px;
        }

        .bar-col {
          flex: 1;
          display: flex;
          flex-direction: column;
          align-items: center;
        }

        .bar-bg {
          width: 28px;
          height: 150px;
          background: #dce7e1;
          border-radius: 2px;
          position: relative;
        }

        .bar-fill {
          width: 100%;
          background: #5b756b;
          border-radius: 2px;
          position: absolute;
          bottom: 0;
          transition: height 0.4s ease;
        }

        .bar-label {
          margin-top: 6px;
          font-size: 13px;
          color: #455c54;
        }

        .bar-score {
          font-size: 12px;
          color: #6e857c;
        }

        .tag-row {
          display: flex;
          gap: 10px;
          justify-content: center;
          margin: 20px 0;
          flex-wrap: wrap;
        }

        .tag {
          padding: 6px 14px;
          border: 1px solid #a9bdb4;
          background: rgba(120,150,140,0.06);
          border-radius: 3px;
          color: #2f403b;
        }

        .identity-desc{
          padding:16px 14px;
          margin:12px 0 18px;
          border:1px solid #c9d9d1;
          background:rgba(255,255,255,0.45);
          border-radius:10px;
          line-height:1.75;
          font-size:15px;
          color:#334842;
        }

        .res-signature {
          text-align: center;
          margin: 22px 0 12px;
          color: #5f746c;
          font-size: 15px;
          letter-spacing: 2px;
        }

        .res-bottom {
          display: flex;
          gap: 12px;
          justify-content: center;
          margin-top: 8px;
          flex-wrap: wrap;
        }

        .book-wrap {
          max-width: 680px;
          margin: 0 auto;
          display: none;
          text-align: left;
        }

        .book-wrap h2 {
          text-align: center;
          font-size: 34px;
          margin-bottom: 30px;
          letter-spacing: 4px;
          color: #243531;
        }

        .book-card {
          border: 1px solid #b9cdc4;
          padding: 18px 22px;
          border-radius: 8px;
          margin-bottom: 14px;
          background: rgba(120,150,140,0.04);
        }

        .book-card h3 {
          font-size: 20px;
          margin-bottom: 6px;
          color: #243531;
        }

        .book-card p {
          color: #455c54;
          line-height: 1.7;
          font-size: 15px;
        }

        .book-back {
          text-align: center;
          margin-top: 30px;
        }

        .donate-box {
          margin-top: 28px;
          padding: 20px 14px;
          border-top: 1px solid #c9d9d1;
          text-align: center;
        }

        .donate-tip {
          color: #5f746c;
          font-size: 14px;
          margin-bottom: 12px;
          letter-spacing: 1px;
        }

        .donate-qr {
          width: 130px;
          height: 130px;
          border-radius: 6px;
          border: 1px solid #b9cdc4;
        }

        @media (max-width: 520px) {
          h1 {
            font-size: 24px;
            letter-spacing: 3px;
          }
          .q-title {
            font-size: 20px;
          }
          .home-card,
          .q-card {
            padding: 28px 20px;
          }
        }

        .dynamic-bg {
          position: fixed;
          inset: 0;
          z-index: -1;
          overflow: hidden;
          pointer-events: none;
          background:
            radial-gradient(circle at 20% 10%, rgba(140, 170, 160, 0.18), transparent 32%),
            radial-gradient(circle at 80% 20%, rgba(120, 150, 140, 0.14), transparent 28%),
            linear-gradient(180deg, #f4f7f4 0%, #eef3ef 45%, #e6ece6 100%);
        }

        .mountain {
          position: absolute;
          left: 0;
          right: 0;
          bottom: 0;
          height: 40%;
          background: linear-gradient(180deg, rgba(255,255,255,0) 0%, rgba(255,255,255,0) 40%, rgba(200,215,208,0.35) 100%);
          filter: blur(0.5px);
          opacity: 0.55;
        }

        .mountain::before,
        .mountain::after {
          content: "";
          position: absolute;
          left: -10%;
          width: 120%;
          height: 70%;
          background-repeat: repeat-x;
          background-size: 400px 180px;
          opacity: 0.35;
        }

        .mountain::before {
          bottom: 10%;
          background-image:
            radial-gradient(ellipse 120px 60px at 10% 100%, #7f9b91 0%, transparent 60%),
            radial-gradient(ellipse 160px 80px at 30% 100%, #6b857c 0%, transparent 60%),
            radial-gradient(ellipse 140px 70px at 55% 100%, #85a59a 0%, transparent 60%),
            radial-gradient(ellipse 180px 90px at 75% 100%, #739288 0%, transparent 60%),
            radial-gradient(ellipse 130px 65px at 90% 100%, #88a59a 0%, transparent 60%);
          animation: mountain-move 40s linear infinite;
        }

        .mountain::after {
          bottom: 0;
          background-image:
            radial-gradient(ellipse 100px 50px at 15% 100%, #5f7c73 0%, transparent 60%),
            radial-gradient(ellipse 140px 70px at 40% 100%, #4f6b63 0%, transparent 60%),
            radial-gradient(ellipse 120px 60px at 65% 100%, #648279 0%, transparent 60%),
            radial-gradient(ellipse 150px 75px at 85% 100%, #5a776f 0%, transparent 60%);
          animation: mountain-move 60s linear infinite reverse;
        }

        @keyframes mountain-move {
          0% { transform: translateX(0); }
          100% { transform: translateX(-80px); }
        }

        .bg-fog {
          position: absolute;
          width: 60%;
          height: 180px;
          border-radius: 50%;
          filter: blur(20px);
          opacity: 0.35;
          animation: fog-flow linear infinite;
        }

        .bg-fog.fog-1 {
          top: 18%;
          left: -20%;
          background: rgba(255, 255, 255, 0.6);
          animation-duration: 28s;
        }

        .bg-fog.fog-2 {
          top: 35%;
          left: -30%;
          background: rgba(210, 225, 218, 0.5);
          animation-duration: 36s;
          animation-delay: -10s;
        }

        .bg-fog.fog-3 {
          top: 55%;
          left: -25%;
          background: rgba(255, 255, 255, 0.45);
          animation-duration: 42s;
          animation-delay: -20s;
        }

        @keyframes fog-flow {
          0% { transform: translateX(0); }
          100% { transform: translateX(180vw); }
        }

        .bg-leaf {
          position: absolute;
          top: -40px;
          width: 12px;
          height: 12px;
          background: radial-gradient(circle at 30% 30%, #9bb7ad, #4f6b63);
          border-radius: 80% 0 80% 0;
          opacity: 0.55;
          animation: bg-leaf-fall linear infinite;
        }

        .bg-leaf:nth-child(1) { left: 8%; animation-duration: 14s; }
        .bg-leaf:nth-child(2) { left: 25%; animation-duration: 17s; animation-delay: -4s; }
        .bg-leaf:nth-child(3) { left: 45%; animation-duration: 15s; animation-delay: -8s; }
        .bg-leaf:nth-child(4) { left: 62%; animation-duration: 19s; animation-delay: -2s; }
        .bg-leaf:nth-child(5) { left: 78%; animation-duration: 16s; animation-delay: -11s; }
        .bg-leaf:nth-child(6) { left: 90%; animation-duration: 20s; animation-delay: -6s; }

        @keyframes bg-leaf-fall {
          0% { transform: translateY(-20px) translateX(0) rotate(0deg); opacity: 0; }
          10% { opacity: 0.6; }
          100% { transform: translateY(110vh) translateX(60px) rotate(720deg); opacity: 0; }
        }

        .bg-light {
          position: absolute;
          width: 6px;
          height: 6px;
          border-radius: 50%;
          background: rgba(255, 255, 255, 0.9);
          box-shadow: 0 0 12px rgba(255, 255, 255, 0.8);
          opacity: 0;
          animation: light-float 8s ease-in-out infinite;
        }

        .bg-light:nth-child(1) { left: 20%; top: 30%; animation-delay: 0s; }
        .bg-light:nth-child(2) { left: 50%; top: 18%; animation-delay: -3s; }
        .bg-light:nth-child(3) { left: 72%; top: 42%; animation-delay: -5s; }
        .bg-light:nth-child(4) { left: 35%; top: 60%; animation-delay: -7s; }

        @keyframes light-float {
          0%, 100% { opacity: 0; transform: translateY(0); }
          50% { opacity: 0.7; transform: translateY(-20px); }
        }
    </style>
</head>
<body>

<div class="dynamic-bg">
    <div class="bg-fog fog-1"></div>
    <div class="bg-fog fog-2"></div>
    <div class="bg-fog fog-3"></div>
    <div class="bg-light"></div>
    <div class="bg-light"></div>
    <div class="bg-light"></div>
    <div class="bg-light"></div>
    <div class="bg-leaf"></div>
    <div class="bg-leaf"></div>
    <div class="bg-leaf"></div>
    <div class="bg-leaf"></div>
    <div class="bg-leaf"></div>
    <div class="bg-leaf"></div>
    <div class="mountain"></div>
</div>

<div class="jianghu-stage">
    <div class="jianghu-bg">
        <img src="zhulin.jpg" alt="竹林">
    </div>
    <div class="fog fog-1"></div>
    <div class="fog fog-2"></div>
    <div class="fog fog-3"></div>
    <div class="leaf leaf-1"></div>
    <div class="leaf leaf-2"></div>
    <div class="leaf leaf-3"></div>
    <div class="leaf leaf-4"></div>
    <div class="slash slash-left"></div>
    <div class="slash slash-right"></div>
    <div class="jianghu-vignette"></div>
</div>

<div id="home">
    <div class="home-card">
        <div class="title-seal">江湖门派测试</div>
        <h1>寒江孤影，江湖故人，少侠归于何门？</h1>
        <div class="divider">
            <span class="line"></span>
            <span class="dot"></span>
            <span class="line"></span>
        </div>
        <div class="btn-group">
            <button id="startBtn">开始测试</button>
            <button id="bookBtn">江湖图鉴</button>
        </div>
    </div>
</div>

<div class="q-wrap" id="questionBox">
    <div class="q-card">
        <div class="q-index" id="qIndex"></div>
        <div class="q-title" id="qTitle"></div>
        <div id="optList"></div>
        <div class="ctrl-row">
            <button id="prevBtn">上一题</button>
        </div>
    </div>
</div>

<div class="res-wrap" id="resultBox">
    <h2>你的江湖身份：</h2>
    <div class="bar-box" id="barBox"></div>
    <div class="tag-row" id="tagRow"></div>
    <div class="identity-desc" id="identityDesc"></div>

    <div class="res-signature">
        江湖路远，祝少侠一帆风顺！
    </div>
    <div class="res-bottom">
        <button id="restartBtn">再测一次</button>
        <button id="saveImgBtn">保存图片</button>
        <button id="shareBtn">分享给朋友</button>
        <button id="toBookBtn">江湖图鉴</button>
    </div>

    <div class="donate-box" data-html2canvas-ignore>
        <div class="donate-tip">感谢小友投喂，江湖一遇，幸甚之至</div>
        <img class="donate-qr" src="donate.jpg" alt="打赏">
    </div>
</div>

<div class="book-wrap" id="bookBox">
    <h2>江湖图鉴</h2>
    <div id="bookList"></div>
    <div class="book-back">
        <button id="backHomeBtn">返回首页</button>
    </div>
</div>

<script>
  const dimNames = ["侠气","赤诚","桀骜","敏锐","重诺","赴义","沉稳","洒脱"];
  const dimMax = 5;

  const questions = [
    {title:"路遇陌生人被强敌追杀，你会？",opt:[{txt:"出手相助，不问缘由",s:[0,2,0,0,1,2,1,0]},{txt:"静观其变，看清局势再决定",s:[1,1,0,2,0,1,2,0]},{txt:"绕道避开，不多管闲事",s:[2,0,0,1,0,0,0,2]},{txt:"暗中布局，坐收渔利",s:[2,0,2,2,0,0,1,0]}]},
    {title:"你最向往的兵器是？",opt:[{txt:"长剑，潇洒快意",s:[2,1,1,1,1,2,1,1]},{txt:"短刃，灵动突袭",s:[2,0,2,2,0,1,1,0]},{txt:"折扇，文雅藏锋",s:[1,1,0,2,0,1,2,1]},{txt:"重刀，势大力沉",s:[2,0,2,1,0,1,2,0]}]},
    {title:"江湖传言藏有绝世秘籍，你会？",opt:[{txt:"不强求，随缘相逢",s:[1,1,0,1,0,0,1,2]},{txt:"有机会就探寻，不强夺",s:[1,1,1,1,0,1,1,1]},{txt:"权衡利弊，值得才出手",s:[1,0,0,2,0,0,2,0]},{txt:"不惜代价拿到手",s:[2,0,2,2,0,0,1,0]}]},

    {name:"独行刀客",desc:"独来独往，刀斩是非。不喜抱团，恩怨自己了结，沉默但立场分明。",newDesc:"冷月如霜，孤影相随，我向来习惯了黑暗里的刀光血影。不需要同伴的温存，也不需要旁人的理解，所有的恩怨是非，皆用手中的刀做个了断。",vec:[4,2,5,3,3,4,3,2]},
    {name:"闲云散人",desc:"万事随缘，不争不抢。对权势秘籍皆淡然，只求日子安稳自在。",newDesc:"世人争得头破血流的绝世秘籍，在我眼里不过是一场过眼云烟。不求权倾天下，只愿偷得浮生半日闲，活得自在洒脱，方不辜负这匆匆一生。",vec:[2,2,2,3,2,2,3,5]},
    {name:"慎思谋士",desc:"心思细腻，三思而行。遇事不冲动，习惯权衡利弊，稳妥求全。",newDesc:"棋盘之上，落子无悔，每一步算计都是为了在乱世中求得一线生机。我不信天命，只信人心的筹谋，在波诡云谲的局里，唯有谨慎方能活到最后。",vec:[2,2,3,5,3,2,5,2]},
    {name:"情报暗探",desc:"游走各方，洞悉秘闻。善于观察，消息灵通，藏于暗处，很少引人注目。",newDesc:"烛影摇曳的暗室里，我听到了这个江湖最不可告人的秘密。我永远只能活在阴影里，像一具没有温度的幽灵，用情报编织着别人的生死命运。",vec:[2,1,4,5,3,2,4,2]},
    {name:"守山长老",desc:"看淡纷争，守护一方。不喜扩张，只愿护住自己在意的人和土地。",newDesc:"岁月斑驳了山门前的石阶，我老了，却依然是这座山最后的一道防线。谁也休想踏过这里半步，只要我还有一口气在，这片故土便不容外人践踏。",vec:[3,3,2,2,4,3,5,3]},
    {name:"奇门匠师",desc:"精通机关巧术，匠心独运。不靠蛮力，以巧思取胜，低调又强大。",newDesc:"铁锤叮当，火星四溅，冰冷的机关里藏着我一生的骄傲与执念。世人皆迷信绝世武功，却不知我手中巧夺天工的秘器，同样能掌控苍生的生死。",vec:[3,2,4,5,3,2,4,2]},
    {name:"玉面军师",desc:"擅长布局，运筹帷幄。不喜欢亲自厮杀，擅长谋划，引导局势走向。",newDesc:"羽扇轻扬，谈笑间樯橹灰飞烟灭，运筹帷幄才是最让人着迷的杀局。我不需要亲自挥刀冲锋，只要用胸中沟壑，便能轻易搅动这天下的风云变幻。",vec:[3,2,4,5,3,3,4,2]},
    {name:"逍遥客",desc:"今朝有酒今朝醉，不爱长久谋划。享受当下，随性洒脱，不喜被人捆绑。",newDesc:"今朝有酒今朝醉，管他明日洪水滔天，这世间最痛快的事不过大梦一场。别拿那些条条框框来束缚我，一壶烈酒、一柄长剑，我就是天地间最自由的魂。",vec:[4,3,4,3,2,3,2,5]},
    {name:"毒谷主人",desc:"精通毒术，善恶随心。不主动害人，但谁若冒犯，自有自保手段。",newDesc:"他们都说我是杀人不眨眼的魔头，却不知人心有时比剧毒还要狠戾三分。我只想守着我的百草毒虫，人不犯我，我自清高；人若犯我，百倍奉还。",vec:[3,2,5,4,2,3,3,3]},
    {name:"影卫",desc:"隐于阴影，听命行事。隐忍克制，执行力极强，情绪很少外露。",newDesc:"黑暗是我的铠甲，沉默是我的宿命，主人的意志便是我存在的唯一意义。我没有名字，没有喜怒哀乐，只有在出鞘的那一瞬间，才算真正活过。",vec:[2,2,4,4,5,4,4,1]},
    {name:"商贾豪侠",desc:"手握财帛，互通江湖。以财力游走各派，重信誉，也懂得利益交换。",newDesc:"金银财宝不过是穿肠毒药，但在这个乱世，它们却是通往生路的桥梁。我用信誉和筹码交织成一张无形的大网，在刀光剑影里护住一方商路太平。",vec:[3,3,3,4,5,2,4,2]},
    {name:"镇关守将",desc:"镇守隘口，职责至上。把守护疆土、关卡安宁放在第一位，沉稳坚毅。",newDesc:"战马嘶鸣，长枪染血，我站在这座孤城的高墙上，身后便是万家灯火。纵然城破人亡，我也要用累累白骨筑起一道铁壁，绝不让外敌前进一步。",vec:[4,4,3,2,5,5,5,2]},
    {name:"诡策客",desc:"善用奇谋，不循常理。思路跳脱，常常出人意料，是一把双刃剑。",newDesc:"常规的规矩不过是用来打破的，出其不意的奇谋才是一切的破局之匙。世人笑我行事乖张离经叛道，可他们永远猜不到我下一步究竟落向何方。",vec:[3,2,5,5,2,3,3,3]},
    {name:"魔教护法",desc:"不循世俗正道，自有一套准则。恩怨分明，不服条条框框的束缚。",newDesc:"世人眼中的正邪，不过是强者随口定义的虚伪面具罢了。我偏要撕碎这虚伪的枷锁，按自己的心意活个痛快，哪怕遗臭万年也绝不向世俗低头。",vec:[4,3,5,3,3,4,2,3]},
    {name:"夺势枭雄",desc:"野心藏于骨，不甘屈居人下。目标清晰，愿意为目标步步筹谋。",newDesc:"懦弱的人才在角落里瑟瑟发抖，而强者永远踩着尸骨向上攀爬。我不甘心屈居于任何人之下，哪怕双手沾满鲜血，我也要亲手摘下至高的王座。",vec:[4,2,5,4,3,3,4,2]},
    {name:"乱世霸主",desc:"胸怀宏图，欲掌风云。有统领众人的魄力，敢打破旧格局。",newDesc:"旧的秩序已经腐朽不堪，那就由我来亲手砸碎它，建立一个新的盛世。男儿生于乱世，当手握百万雄兵，扫平六合八荒，让整个天下俯首称臣。",vec:[5,2,5,4,3,4,4,2]},
    {name:"修罗武尊",desc:"信奉力量，以武证道。痴迷武道巅峰，强者为尊，敬畏很少。",newDesc:"拳头才是这个江湖唯一的真理，弱肉强食，强者才有资格主宰一切。我穷尽毕生追求武道的极致，不为什么大义，只为站在群山之巅俯瞰众生。",vec:[5,2,5,3,2,4,3,2]},
    {name:"阴谋阁主",desc:"擅长暗流博弈，不动声色收揽筹码。城府深沉，很少展露真心。",newDesc:"暗流汹涌的棋局里，每一个人都不过是我手中的一颗棋子而已。我隐匿在最深的黑暗中，不动声色地收割着所有的筹码，静静等待最后的收网。",vec:[2,1,5,5,3,2,5,1]},
    {name:"夺鼎枭雄",desc:"不甘居于人下，伺机而动，乱世之中伺机夺取话语权。",newDesc:"时势造英雄，风云变幻的乱世正是我们大展身手的最好舞台。我不信什么天命所归，只要给够我时间与契机，这天下的最高权柄便迟早落入我手中。",vec:[4,2,5,4,3,3,4,2]},
    {name:"独霸宗主",desc:"执掌一派，说一不二。威严深重，门下之人皆听号令。",newDesc:"诺大的宗门压在我一人肩上，我的一言一行便是不可违抗的铁律。为了门派的荣耀与存亡，哪怕背负暴君的骂名，我也要用雷霆手段肃清一切。",vec:[4,3,4,3,4,4,5,2]},
    {name:"万鬼楼主",desc:"行事孤绝，不在乎世间评价。手段凌厉，旁人不敢轻易招惹。",newDesc:"哭声与哀嚎是这个世界上最动听的音乐，我游走于生死边缘，从不在乎世人的唾骂。既然这世道本就冰冷残酷，那就让我做最冷血的执刀人。",vec:[3,1,5,4,2,3,3,2]},
    {name:"江湖共主",desc:"有一统江湖的气魄，能压服各方势力，一言可搅动天下风云。",newDesc:"坐在这个至高无上的位置上，放眼望去，才发现高处不胜寒。既然命运把我推到了风口浪尖，我便要一言定乾坤，让这整个江湖都为之颤抖。",vec:[5,2,5,4,4,5,5,2]}
  ];

  let current = 0;
  let answerList = [];
  let dimScore = [0,0,0,0,0,0,0,0];

  const home = document.getElementById("home");
  const qBox = document.getElementById("questionBox");
  const rBox = document.getElementById("resultBox");
  const bBox = document.getElementById("bookBox");
  const qIndex = document.getElementById("qIndex");
  const qTitle = document.getElementById("qTitle");
  const optList = document.getElementById("optList");
  const prevBtn = document.getElementById("prevBtn");
  const barBox = document.getElementById("barBox");
  const tagRow = document.getElementById("tagRow");
  const identityDescDom = document.getElementById("identityDesc");
  const bookListDom = document.getElementById("bookList");
  const saveImgBtn = document.getElementById("saveImgBtn");
  const shareBtn = document.getElementById("shareBtn");
  const restartBtn = document.getElementById("restartBtn");
  const toBookBtn = document.getElementById("toBookBtn");
  const backHomeBtn = document.getElementById("backHomeBtn");

  resultList.forEach(item=>{
    const card = document.createElement("div");
    card.className = "book-card";
    card.innerHTML = `<h3>${item.name}</h3><p>${item.desc}</p>`;
    bookListDom.appendChild(card);
  })

  function showPage(p){
    home.style.display="none";
    qBox.style.display="none";
    rBox.style.display="none";
    bBox.style.display="none";
    if(p==="home") home.style.display="block";
    if(p==="q") qBox.style.display="block";
    if(p==="res") rBox.style.display="block";
    if(p==="book") bBox.style.display="block";
  }

  function calcScore(){
    dimScore = [0,0,0,0,0,0,0,0];
    for(let s of answerList){
      if(s) dimScore = dimScore.map((v,i)=>v+s[i]);
    }
  }

  function renderQ(){
    const q = questions[current];
    qIndex.innerText = `第 ${current+1} / ${questions.length} 题`;
    qTitle.innerText = q.title;
    optList.innerHTML = "";
    q.opt.forEach((o,idx)=>{
      const div = document.createElement("div");
      div.className = "opt-item";
      div.innerText = o.txt;
      div.onclick = ()=>{
        answerList[current] = o.s;
        calcScore();
        current++;
        if(current >= questions.length){
          showResult();
        }else{
          renderQ();
        }
      }
      optList.appendChild(div);
    })
    prevBtn.style.visibility = current>0 ? "visible":"hidden";
  }

  prevBtn.onclick = ()=>{
    if(current <= 0) return;
    current--;
    renderQ();
  }

  //余弦相似度
  function cosSimilarity(a,b){
    let dot=0,normA=0,normB=0;
    for(let i=0;i<8;i++){
      dot += a[i]*b[i];
      normA += a[i]*a[i];
      normB += b[i]*b[i];
    }
    if(normA===0||normB===0) return 0;
    return dot/(Math.sqrt(normA)*Math.sqrt(normB));
  }

  // 记录每个角色的冷门补偿权重与命中次数
  if(!window._charWeights) {
    window._charWeights = new Array(resultList.length).fill(1.0);
  }

  function showResult(){
    showPage("res");
    const maxRaw = Math.max(...dimScore);
    const norm = dimScore.map(v=> maxRaw===0 ? 0 : Math.round(v/maxRaw * 5));

    barBox.innerHTML = "";
    const row = document.createElement("div");
    row.className="bar-row";
    for(let i=0;i<8;i++){
      const col = document.createElement("div");
      col.className="bar-col";
      col.innerHTML = `
        <div class="bar-bg">
          <div class="bar-fill" style="height:${norm[i]/dimMax*100}%"></div>
        </div>
        <div class="bar-label">${dimNames[i]}</div>
        <div class="bar-score">${norm[i]}</div>
      `;
      row.appendChild(col);
    }
    barBox.appendChild(row);

    const rank = [...norm].map((v,i)=>({v,i})).sort((a,b)=>b.v-a.v);
    tagRow.innerHTML = "";
    for(let i=0;i<3;i++){
      const t = document.createElement("span");
      t.className="tag";
      t.innerText = dimNames[rank[i].i];
      tagRow.appendChild(t);
    }

    // 计算所有角色的相似度并乘以动态权重（保证全角色均可命中且不脱离人设）
    let simArr = [];
    for(let j=0;j<resultList.length;j++){
      const sim = cosSimilarity(norm, resultList[j].vec);
      // 综合相似度与动态权重
      const finalScore = (sim + 0.1) * window._charWeights[j];
      simArr.push({idx:j, score:finalScore});
    }

    // 降序排序，取前 5 个候选人进行平权加权随机
    simArr.sort((x,y)=>y.score - x.score);
    const topCandidates = simArr.slice(0, 5);

    let totalWeight = 0;
    for(let item of topCandidates) totalWeight += item.score;
    let rnd = Math.random() * totalWeight;
    let pickIdx = topCandidates[0].idx;
    for(let item of topCandidates){
      rnd -= item.score;
      if(rnd <= 0){
        pickIdx = item.idx;
        break;
      }
    }

    // 动态调整权重：被选中的稍微降低权重防止霸榜，未被选中的累积补偿权重
    for(let j=0; j<resultList.length; j++){
      if(j === pickIdx){
        window._charWeights[j] = Math.max(0.5, window._charWeights[j] * 0.85);
      } else {
        window._charWeights[j] = Math.min(3.0, window._charWeights[j] + 0.05);
      }
    }

    const res = resultList[pickIdx];
    document.querySelector(".res-wrap h2").innerText = `你的江湖身份：${res.name}`;
    identityDescDom.innerText = res.newDesc;
  }

  saveImgBtn.onclick = async ()=>{
    try{
      const canvas = await html2canvas(rBox, {scale:2,useCORS:true});
      const link = document.createElement("a");
      link.download = "江湖测试结果.png";
      link.href = canvas.toDataURL("image/png");
      link.click();
    }catch(e){
      alert("保存失败");
    }
  }

  shareBtn.onclick = async ()=>{
    alert("截图分享结果即可");
  }

  restartBtn.onclick = ()=>{
    current=0;
    answerList=[];
    dimScore=[0,0,0,0,0,0,0,0];
    showPage("home");
  }

  bookBtn.onclick = ()=>showPage("book");
  toBookBtn.onclick = ()=>showPage("book");
  backHomeBtn.onclick = ()=>{
    current=0;
    answerList=[];
    dimScore=[0,0,0,0,0,0,0,0];
    showPage("home");
  }

  //启动
  startBtn.onclick = ()=>{
    current=0;
    answerList=[];
    dimScore=[0,0,0,0,0,0,0,0];
    showPage("q");
    renderQ();
  }
</script>
